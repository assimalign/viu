# Build the versioned documentation home ([V01.01.13.04], #101; [V01.01.13.05], #102).
# Publication is OFF until the owner sets VIU_DEPLOY_DOCS=true under repository Settings ->
# Secrets and variables -> Actions -> Variables, and enables Settings -> Pages with the
# GitHub Actions source. A successful main build can then deploy; pull requests never deploy.
# The deploy job alone receives Pages/OIDC write permissions. configure-pages does not enable
# Pages itself. The api-reference artifact remains available even when publication is disabled.
name: Documentation

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:
        branches: [main]
        paths:
            - "libraries/**"
            - "docs/**"
            - "scripts/**"
            - "tooling/**"
            - "analyzers/**"
            - "build/**"
            - "frameworks/**"
            - "sdks/**"
            - "extensions/**/README.md"
            - "README.md"
            - ".config/dotnet-tools.json"
            - "Assimalign.Viu.slnx"
            - "Directory.Build.props"
            - "Directory.Build.targets"
            - "global.json"
            - "nuget.config"
            - ".github/workflows/api-reference.yml"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    build:
        name: Build documentation
        runs-on: windows-latest
        timeout-minutes: 60
        steps:
            - name: Checkout
              # actions/checkout v7.0.1
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            # #101 requires every uses entry to carry a SHA. Keep this pin aligned with the
            # shared setup-dotnet-wasm action; global.json remains the only SDK version source.
            - name: Set up .NET SDK
              # actions/setup-dotnet v4.3.1
              uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
              with:
                  global-json-file: global.json

            - name: Install WebAssembly build prerequisites
              shell: pwsh
              run: dotnet workload install wasm-tools --skip-manifest-update

            - name: Restore solution dependencies
              shell: pwsh
              run: dotnet restore Assimalign.Viu.slnx -p:Configuration=Release

            - name: Check documentation links offline
              shell: pwsh
              run: ./scripts/Test-DocumentationLinks.ps1

            - name: Build site and validate API reference
              shell: pwsh
              run: |
                  ./scripts/tests/Test-DocumentationLinks.ps1
                  ./scripts/tests/Test-ApiReference.ps1
                  ./scripts/Build-ApiReference.ps1

            - name: Upload API reference
              # actions/upload-artifact v7.0.1
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: api-reference
                  path: _out/api-reference/
                  if-no-files-found: error

    deploy:
        name: Deploy documentation to GitHub Pages
        needs: build
        if: github.ref == 'refs/heads/main' && vars.VIU_DEPLOY_DOCS == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            pages: write
            id-token: write
            contents: read
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Download built documentation
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: api-reference
                  path: _out/api-reference/

            - name: Configure GitHub Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
              with:
                  enablement: false

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  name: github-pages
                  path: _out/api-reference/

            - name: Deploy GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
              with:
                  artifact_name: github-pages
