# Windows-only build and test for the in-process Visual Studio client and
# its editor-neutral, out-of-process Viu language server. Publishing belongs to release.yml.
name: area-visual-studio

on:
  push:
    branches: [main]
    paths:
      - 'extensions/VisualStudio/**'
      # The language service, the language server, and the build-time tooling libraries they
      # carry (the shared .viu -> C# projection core [V01.01.06.11] and the utility engine) all
      # ship inside the language-server payload, so any tooling change must re-verify the
      # extension build and the packaged VSIX.
      - 'tooling/**'
      - 'libraries/Assimalign.Viu.Syntax*/**'
      - 'build/**'
      - 'scripts/Test-UtilityCssArtifactShape.ps1'
      - 'scripts/Test-UtilityCssIndependence.ps1'
      # The packed-consumer round trip consumes the Install-Local feed (SDK + framework packs), so
      # its lane inputs re-verify this workflow ([V01.01.12.23]).
      - 'scripts/Install-Local.ps1'
      - 'scripts/Test-LanguageServerSemanticRoundTrip.ps1'
      - 'sdks/**'
      - 'frameworks/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.github/actions/**'
      - '.github/workflows/area-visual-studio.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extensions/VisualStudio/**'
      # The language service, the language server, and the build-time tooling libraries they
      # carry (the shared .viu -> C# projection core [V01.01.06.11] and the utility engine) all
      # ship inside the language-server payload, so any tooling change must re-verify the
      # extension build and the packaged VSIX.
      - 'tooling/**'
      - 'libraries/Assimalign.Viu.Syntax*/**'
      - 'build/**'
      - 'scripts/Test-UtilityCssArtifactShape.ps1'
      - 'scripts/Test-UtilityCssIndependence.ps1'
      # The packed-consumer round trip consumes the Install-Local feed (SDK + framework packs), so
      # its lane inputs re-verify this workflow ([V01.01.12.23]).
      - 'scripts/Install-Local.ps1'
      - 'scripts/Test-LanguageServerSemanticRoundTrip.ps1'
      - 'sdks/**'
      - 'frameworks/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.github/actions/**'
      - '.github/workflows/area-visual-studio.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  build-test:
    name: build and test Visual Studio extension
    runs-on: windows-latest
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet-wasm

      - name: Build extension
        shell: pwsh
        run: ./extensions/VisualStudio/Build.ps1 -Configuration Release

      # The packed-consumer semantic round trip ([V01.01.12.23], #259, acceptance criterion 5):
      # pack the SDK + framework feed, then drive the published single-file server over stdio
      # against a restored consumer scaffold. Runs here because this is the only lane that builds
      # the server payload; area-packaging never does. Cost: roughly six to eight minutes.
      - name: Install local Viu packages
        shell: pwsh
        run: ./scripts/Install-Local.ps1

      - name: Verify packed-consumer semantic round trip
        shell: pwsh
        run: ./scripts/Test-LanguageServerSemanticRoundTrip.ps1 -Configuration Release

      # The test projects are named individually rather than handing over
      # Assimalign.Viu.VisualStudio.slnx: that solution also carries the extension itself, which is a
      # classic in-process VSSDK package whose build tasks are .NET Framework MSBuild tasks and
      # cannot load under `dotnet`. The extension is built and packaged by Build.ps1 above, through
      # Visual Studio's MSBuild.
      - name: Test language service
        run: dotnet test tooling/Assimalign.Viu.Tooling.LanguageService/test/Assimalign.Viu.Tooling.LanguageService.Tests.csproj --configuration Release

      - name: Test language server
        run: dotnet test tooling/Assimalign.Viu.Tooling.LanguageServer/test/Assimalign.Viu.Tooling.LanguageServer.Tests.csproj --configuration Release

      - name: Test Visual Studio extension
        run: dotnet test extensions/VisualStudio/Assimalign.Viu.VisualStudio/test/Assimalign.Viu.VisualStudio.Tests.csproj --configuration Release

      - name: Inspect packaged VSIX
        shell: pwsh
        run: |
          $extensionPath = '_out/extensions/VisualStudio/Release/Assimalign.Viu.VisualStudio.vsix'
          $extensionFile = Get-Item -LiteralPath $extensionPath
          $maximumPackageSize = 50MB
          if ($extensionFile.Length -gt $maximumPackageSize) {
            throw "The VSIX is $($extensionFile.Length) bytes; Marketplace packages must remain at or below $maximumPackageSize bytes."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $extensionArchive = [System.IO.Compression.ZipFile]::OpenRead(
            $extensionFile.FullName)
          try {
            $manifestEntry = $extensionArchive.GetEntry('extension.vsixmanifest')
            if ($null -eq $manifestEntry) {
              throw 'The VSIX does not contain extension.vsixmanifest.'
            }

            $manifestReader = [System.IO.StreamReader]::new($manifestEntry.Open())
            try {
              [xml] $manifest = $manifestReader.ReadToEnd()
            }
            finally {
              $manifestReader.Dispose()
            }

            $namespaceManager = [System.Xml.XmlNamespaceManager]::new(
              $manifest.NameTable)
            $namespaceManager.AddNamespace(
              'vsix',
              'http://schemas.microsoft.com/developer/vsx-schema/2011')
            $identity = $manifest.SelectSingleNode(
              '/vsix:PackageManifest/vsix:Metadata/vsix:Identity',
              $namespaceManager)
            $preview = $manifest.SelectSingleNode(
              '/vsix:PackageManifest/vsix:Metadata/vsix:Preview',
              $namespaceManager)
            if ($null -eq $identity) {
              throw 'The VSIX manifest does not contain an Identity element.'
            }
            if ($identity.Id -ne 'Assimalign.Viu.VisualStudio.3c6324dd-5c21-46a2-98d1-6b7b5d701f7c') {
              throw "Unexpected VSIX identity: $($identity.Id)."
            }
            if ($identity.Publisher -ne 'Assimalign') {
              throw "Unexpected VSIX publisher: $($identity.Publisher)."
            }
            if ($null -eq $preview -or $preview.InnerText -ne 'true') {
              throw 'The Visual Studio extension must remain a Marketplace preview.'
            }
          }
          finally {
            $extensionArchive.Dispose()
          }

          $extensionHash = Get-FileHash -LiteralPath $extensionPath -Algorithm SHA256
          Write-Host "Validated VSIX $($identity.Version), $($extensionFile.Length) bytes, SHA256 $($extensionHash.Hash)."

      - name: Verify Visual Studio utility payload
        shell: pwsh
        run: >-
          ./scripts/Test-UtilityCssArtifactShape.ps1
          -VisualStudioExtension _out/extensions/VisualStudio/Release/Assimalign.Viu.VisualStudio.vsix

      - name: Verify standalone utility dependency boundary
        shell: pwsh
        run: >-
          ./scripts/Test-UtilityCssIndependence.ps1
          -Artifact _out/extensions/VisualStudio/Release/Assimalign.Viu.VisualStudio.vsix

      - name: Upload VSIX build artifact
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Assimalign.Viu.VisualStudio
          path: _out/extensions/VisualStudio/Release/Assimalign.Viu.VisualStudio.vsix
          if-no-files-found: error
          retention-days: 7
