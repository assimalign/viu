# Build+test lane for the developer-tooling libraries ([V01.01.12.02.02]): the Syntax parser cluster,
# the shared .viu -> C# projection and CSS composition cores, the Viu Utilities engine, and the editor
# pair (language service + language server). None ships into a Viu app's runtime. Only the Viu
# Utilities engine is independently packable and publishes from a main push; the parser, compiler,
# and editor projects declare IsPackable=false, so the shared build action skips their pack step.
name: Tooling

on:
    push:
        branches: [main]
        paths:
            - "tooling/**"
            # Tooling consumes runtime contracts and linked sources from libraries/, while analyzers
            # consume the parser/compiler cluster, so changes across either boundary re-verify this root.
            - "libraries/**"
            - "analyzers/**"
            - "build/**"
            - "Directory.Build.props"
            - "Directory.Build.targets"
            - "global.json"
            - "nuget.config"
            - ".github/actions/**"
            - ".github/workflows/tooling.yml"
    pull_request:
        branches: [main]
        paths:
            - "tooling/**"
            - "libraries/**"
            - "analyzers/**"
            - "build/**"
            - "Directory.Build.props"
            - "Directory.Build.targets"
            - "global.json"
            - "nuget.config"
            - ".github/actions/**"
            - ".github/workflows/tooling.yml"

permissions:
    contents: read
    packages: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    build:
        name: tooling (${{ matrix.projects }})
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                projects:
                    [
                        "Assimalign.Viu.Compiler.Css",
                        "Assimalign.Viu.Compiler.SingleFileComponent",
                        "Assimalign.Viu.LanguageServer",
                        "Assimalign.Viu.LanguageService",
                        "Assimalign.Viu.Syntax",
                        "Assimalign.Viu.Syntax.Css",
                        "Assimalign.Viu.Syntax.Html",
                        "Assimalign.Viu.Syntax.SingleFileComponent",
                        "Assimalign.Viu.Syntax.Templates",
                        "Assimalign.Viu.UtilityCss"
                    ]
        steps:
            - name: "Checkout: ${{ matrix.projects }}"
              # actions/checkout v4
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false

            - name: "Build: ${{ matrix.projects }}"
              uses: ./.github/actions/build
              with:
                  area: "tooling"
                  project: ${{ matrix.projects }}
                  publish-packages: "true"
                  github-token: ${{ secrets.GITHUB_TOKEN }}
