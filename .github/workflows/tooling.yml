# Build+test lane for the developer-tooling libraries ([V01.01.12.02.02]): the shared .viu -> C#
# projection and CSS composition cores, the Viu Utilities engine, and the editor pair (language
# service + language server). None ships into a Viu app's runtime. The parked Viu Utilities engine
# remains in this build/test lane but is not packable or part of the Viu release train.
name: Tooling

on:
    push:
        branches: [main]
        paths:
            - "tooling/**"
            # Tooling consumes runtime contracts and linked sources from libraries/, while analyzers
            # consume the parser/compiler cluster, so changes across either boundary re-verify this root.
            - "libraries/**"
            - "analyzers/**"
            - "build/**"
            - "Directory.Build.props"
            - "Directory.Build.targets"
            - "global.json"
            - "nuget.config"
            - ".github/actions/**"
            - ".github/workflows/tooling.yml"
    pull_request:
        branches: [main]
        paths:
            - "tooling/**"
            - "libraries/**"
            - "analyzers/**"
            - "build/**"
            - "Directory.Build.props"
            - "Directory.Build.targets"
            - "global.json"
            - "nuget.config"
            - ".github/actions/**"
            - ".github/workflows/tooling.yml"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    build:
        name: tooling (${{ matrix.project }})
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - project: "Assimalign.Viu.Compiler.Css"
                      path: "tooling/Compiler/Assimalign.Viu.Compiler.Css"
                    - project: "Assimalign.Viu.Compiler.SingleFileComponent"
                      path: "tooling/Compiler/Assimalign.Viu.Compiler.SingleFileComponent"
                    - project: "Assimalign.Viu.LanguageServer"
                      path: "tooling/Editor/Assimalign.Viu.LanguageServer"
                    - project: "Assimalign.Viu.LanguageService"
                      path: "tooling/Editor/Assimalign.Viu.LanguageService"
                    - project: "Assimalign.Viu.UtilityCss"
                      path: "tooling/Assimalign.Viu.UtilityCss"
        steps:
            - name: "Checkout: ${{ matrix.project }}"
              # actions/checkout v4
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false

            - name: "Build: ${{ matrix.project }}"
              uses: ./.github/actions/build
              with:
                  project-path: ${{ matrix.path }}
