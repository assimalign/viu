# Packaging lane for the Viu SDK and the shared-framework packs ([V01.01.12.19], generalized by
# [V01.01.12.02.02]). This is the one root that is not a per-project matrix: Install-Local.ps1 packs
# the whole SDK -> targeting pack -> runtime pack chain as a single artifact set, and the assertions
# below are about the SHAPE of that set, not about any one project. It replaces area-packaging.yml
# and absorbs the artifact assertions the standalone area-utility-css.yml used to duplicate.
#
# Nothing here pushes: publishing is release.yml's job (the checksummed, uniquely versioned beta and
# stable sets), and the per-project canonical-version push lives in .github/actions/build.
name: Packaging

on:
  push:
    branches: [main]
    paths:
      - 'sdks/**'
      - 'frameworks/**'
      - 'scripts/**'
      - 'libraries/**'
      - 'tooling/**'
      - 'analyzers/**'
      - 'build/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.github/actions/**'
      - '.github/workflows/packaging.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/**'
      - 'frameworks/**'
      - 'scripts/**'
      - 'libraries/**'
      - 'tooling/**'
      - 'analyzers/**'
      - 'build/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.github/actions/**'
      - '.github/workflows/packaging.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pack:
    name: packaging (SDK + framework)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # The runtime pack builds the framework closure with -p:RuntimeIdentifier=browser-wasm,
      # which requires the wasm-tools workload (NETSDK1147 without it) — same as the app build.
      # This is the only lane in the repository that needs it: no Viu library targets browser-wasm.
      - name: Set up .NET (with wasm-tools)
        uses: ./.github/actions/setup-dotnet-wasm
        with:
          install-wasm-tools: 'true'

      # Carried over from area-utility-css.yml: Install-Local.ps1 builds the SDK task host on its
      # way to packing it, but not with warnings as errors. This keeps that gate explicit.
      - name: Build SDK task host (warnings are errors)
        run: dotnet build sdks/Assimalign.Viu.Sdk/Tasks/Assimalign.Viu.Sdk.Tasks.csproj --configuration Release -warnaserror

      - name: Pack SDK, runtime pack, and ref pack
        shell: pwsh
        run: ./scripts/Install-Local.ps1

      - name: Compile application-lifetime package consumer
        shell: pwsh
        run: ./scripts/Test-ApplicationLifetimeConsumer.ps1

      - name: Verify standalone utility dependency boundary
        shell: pwsh
        run: >-
          ./scripts/Test-UtilityCssIndependence.ps1
          -Artifact (Get-ChildItem _out/packages -Filter '*.nupkg' | ForEach-Object FullName)

      # Both halves of the utility artifact contract in one place: the SDK's packed utility payload
      # (was area-packaging) and the standalone engine package's own shape (was area-utility-css,
      # which packed it a second time into its own output directory to assert exactly this).
      - name: Verify utility artifact shapes
        shell: pwsh
        run: |
          $sdkPackages = @(
            Get-ChildItem _out/packages -Filter 'Assimalign.Viu.Sdk.*.nupkg'
          )
          if ($sdkPackages.Count -ne 1) {
            throw "Expected exactly one SDK package, found $($sdkPackages.Count)."
          }

          $utilityPackages = @(
            Get-ChildItem _out/packages -Filter 'Assimalign.Viu.UtilityCss.*.nupkg'
          )
          if ($utilityPackages.Count -ne 1) {
            throw "Expected exactly one utility engine package, found $($utilityPackages.Count)."
          }

          ./scripts/Test-UtilityCssArtifactShape.ps1 `
            -SdkPackage $sdkPackages[0].FullName `
            -UtilityCssPackage $utilityPackages[0].FullName

      - name: Assert package shapes
        shell: pwsh
        run: |
          $feed = "_out/packages"
          $expected = @('Assimalign.Viu.Sdk.*.nupkg', 'Assimalign.Viu.App.Ref.*.nupkg', 'Assimalign.Viu.App.Runtime.browser-wasm.*.nupkg')
          foreach ($pattern in $expected) {
            if (-not (Get-ChildItem $feed -Filter $pattern)) { throw "Missing package: $pattern" }
          }

          $expectedFrameworkAssemblies = @(
            'Assimalign.Viu.App',
            'Assimalign.Viu.Browser',
            'Assimalign.Viu.Components',
            'Assimalign.Viu.Core',
            'Assimalign.Viu.Reactivity',
            'Assimalign.Viu.State'
          )

          function Assert-FrameworkPackage {
            param(
              [Parameter(Mandatory)]
              [System.IO.FileInfo] $Package,
              [Parameter(Mandatory)]
              [string] $ManifestPath
            )

            $archive = [System.IO.Compression.ZipFile]::OpenRead($Package.FullName)
            try {
              $manifestEntry = $archive.GetEntry($ManifestPath)
              if ($null -eq $manifestEntry) {
                throw "$($Package.Name) is missing $ManifestPath"
              }

              $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
              try {
                [xml] $manifest = $reader.ReadToEnd()
              }
              finally {
                $reader.Dispose()
              }

              $actualFrameworkAssemblies = @(
                $manifest.DocumentElement.File |
                  Where-Object Type -eq 'Managed' |
                  ForEach-Object AssemblyName |
                  Sort-Object
              )
              $difference = @(Compare-Object $expectedFrameworkAssemblies $actualFrameworkAssemblies)
              if ($difference.Count -ne 0) {
                throw "$($Package.Name) managed assembly manifest differs from the framework contract: $($difference | Out-String)"
              }

              foreach ($assemblyName in $expectedFrameworkAssemblies) {
                $assemblyFileName = "$assemblyName.dll"
                $matchingEntries = @($archive.Entries | Where-Object { $_.FullName.EndsWith("/$assemblyFileName", [System.StringComparison]::Ordinal) })
                if ($matchingEntries.Count -ne 1) {
                  throw "$($Package.Name) must contain exactly one $assemblyFileName, found $($matchingEntries.Count)"
                }
              }
            }
            finally {
              $archive.Dispose()
            }
          }

          $referencePackage = @(Get-ChildItem $feed -Filter 'Assimalign.Viu.App.Ref.*.nupkg')
          $runtimePackage = @(Get-ChildItem $feed -Filter 'Assimalign.Viu.App.Runtime.browser-wasm.*.nupkg')
          $sdkPackage = @(Get-ChildItem $feed -Filter 'Assimalign.Viu.Sdk.*.nupkg')
          if ($referencePackage.Count -ne 1) { throw "Expected exactly one reference pack, found $($referencePackage.Count)" }
          if ($runtimePackage.Count -ne 1) { throw "Expected exactly one browser-wasm runtime pack, found $($runtimePackage.Count)" }
          if ($sdkPackage.Count -ne 1) { throw "Expected exactly one SDK package, found $($sdkPackage.Count)" }

          Assert-FrameworkPackage -Package $referencePackage[0] -ManifestPath 'data/FrameworkList.xml'
          Assert-FrameworkPackage -Package $runtimePackage[0] -ManifestPath 'data/RuntimeList.xml'

          # The ref pack's analyzer payload is the computed ProjectReference closure of the syntax
          # generator ([V01.01.06.11]): the shared projection core must ride along, and Roslyn must
          # not - PackageReference assets never enter _ResolvedProjectReferencePaths, so a
          # Microsoft.CodeAnalysis*.dll here means the closure mechanics regressed (the analyzer
          # host provides Roslyn; shipping a second copy would break generator loading).
          $referenceArchive = [System.IO.Compression.ZipFile]::OpenRead($referencePackage[0].FullName)
          try {
            $analyzerEntries = @(
              $referenceArchive.Entries |
                Where-Object { $_.FullName.StartsWith('analyzers/dotnet/cs/', [System.StringComparison]::Ordinal) } |
                ForEach-Object { $_.FullName.Substring('analyzers/dotnet/cs/'.Length) }
            )
            if ($analyzerEntries -notcontains 'Assimalign.Viu.Compiler.SingleFileComponent.dll') {
              throw "$($referencePackage[0].Name) analyzer payload is missing the shared projection core Assimalign.Viu.Compiler.SingleFileComponent.dll"
            }
            $roslynEntries = @($analyzerEntries | Where-Object { $_ -like 'Microsoft.CodeAnalysis*.dll' })
            if ($roslynEntries.Count -ne 0) {
              throw "$($referencePackage[0].Name) analyzer payload must not carry host-provided Roslyn assemblies: $($roslynEntries -join ', ')"
            }
          }
          finally {
            $referenceArchive.Dispose()
          }

          $sdkArchive = [System.IO.Compression.ZipFile]::OpenRead($sdkPackage[0].FullName)
          try {
            $requiredSdkEntries = @(
              'Tasks/Assimalign.Viu.Sdk.Tasks.dll',
              'Tasks/Assimalign.Viu.Sdk.Tasks.deps.json',
              'Tasks/Assimalign.Viu.Syntax.dll',
              'Tasks/Assimalign.Viu.Syntax.Css.dll',
              'Tasks/Assimalign.Viu.Syntax.SingleFileComponent.dll',
              'Tasks/Assimalign.Viu.Syntax.Templates.dll',
              'Tasks/Assimalign.Viu.Compiler.Css.dll',
              'Tasks/Assimalign.Viu.UtilityCss.dll',
              'Targets/Assimalign.Viu.Generators.Syntax.props',
              'Targets/Assimalign.Viu.Generators.Syntax.targets',
              'Targets/Assimalign.Viu.Sdk.Css.Bundling.targets',
              'Targets/Assimalign.Viu.Sdk.UtilityCss.targets'
            )
            foreach ($entryName in $requiredSdkEntries) {
              if ($null -eq $sdkArchive.GetEntry($entryName)) {
                throw "$($sdkPackage[0].Name) is missing $entryName"
              }
            }

            $forbiddenSdkEntries = @(
              'Tasks/Microsoft.Build.dll',
              'Tasks/Microsoft.Build.Framework.dll',
              'Tasks/Microsoft.Build.Utilities.Core.dll',
              'Tasks/Microsoft.NET.StringTools.dll',
              # The shared .viu -> C# projection core ([V01.01.06.11]) belongs to the generator +
              # language-service graph only. If it ever appears here, a reference leaked into the
              # Sdk.Tasks/Compiler.Css graph, whose whole OutDir sweeps into the SDK package's
              # Tasks/ payload.
              'Tasks/Assimalign.Viu.Compiler.SingleFileComponent.dll',
              'Targets/Assimalign.Viu.Syntax.Generators.props',
              'Targets/Assimalign.Viu.Syntax.Generators.targets'
            )
            foreach ($entryName in $forbiddenSdkEntries) {
              if ($null -ne $sdkArchive.GetEntry($entryName)) {
                throw "$($sdkPackage[0].Name) must not contain stale or host-provided entry $entryName"
              }
            }

            # Roslyn IS legitimately in the task host's reference graph — Sdk.Tasks -> Compiler.Css ->
            # Syntax.Templates parses template expressions with the real C# parser — but it is
            # compile-time-only there ([V01.01.12.19.04]): the ViuBundleCss task composes the style-only parsers and
            # never dispatches template content (Roslyn-backed expression compilation runs only in
            # the source generator, where the compiler host supplies Roslyn), so the Tasks csproj
            # re-declares the whole Roslyn closure with ExcludeAssets=runtime. Any
            # Microsoft.CodeAnalysis assembly under Tasks/ — satellites included — means that
            # compile-only pin regressed and the ~26 MB compiler set is back in the SDK package.
            $taskRoslynEntries = @(
              $sdkArchive.Entries |
                Where-Object { $_.FullName.StartsWith('Tasks/', [System.StringComparison]::Ordinal) -and $_.Name -like 'Microsoft.CodeAnalysis*.dll' } |
                ForEach-Object FullName
            )
            if ($taskRoslynEntries.Count -ne 0) {
              throw "$($sdkPackage[0].Name) must not carry the compile-time-only Roslyn closure under Tasks/: $($taskRoslynEntries -join ', ')"
            }

            $nuspecEntry = @($sdkArchive.Entries | Where-Object { $_.FullName.EndsWith('.nuspec', [System.StringComparison]::OrdinalIgnoreCase) })
            if ($nuspecEntry.Count -ne 1) {
              throw "$($sdkPackage[0].Name) must contain exactly one nuspec, found $($nuspecEntry.Count)"
            }

            $nuspecReader = [System.IO.StreamReader]::new($nuspecEntry[0].Open())
            try {
              [xml] $nuspec = $nuspecReader.ReadToEnd()
            }
            finally {
              $nuspecReader.Dispose()
            }

            $dependencies = @($nuspec.SelectNodes("//*[local-name()='dependency']"))
            if ($dependencies.Count -ne 0) {
              throw "$($sdkPackage[0].Name) must not expose build-time implementation dependencies: $($dependencies.id -join ', ')"
            }
          }
          finally {
            $sdkArchive.Dispose()
          }

          Get-ChildItem $feed -Filter 'Assimalign.Viu.*.nupkg' | ForEach-Object { Write-Host $_.Name }

  sdk-tests:
    # The CSS hot-reload worker under sdks/ has a test project that no retired workflow ever ran: it
    # is in no per-area solution file, and area-packaging only invoked Install-Local.ps1. Generalizing
    # the pipelines is the moment to close that hole.
    name: packaging (SDK tests)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet-wasm

      - name: Build CSS hot-reload worker (warnings are errors)
        run: dotnet build sdks/Assimalign.Viu.Sdk/Watch/test/Assimalign.Viu.Sdk.CssHotReload.Tests.csproj --configuration Release -warnaserror

      - name: Test CSS hot-reload worker
        run: dotnet test sdks/Assimalign.Viu.Sdk/Watch/test/Assimalign.Viu.Sdk.CssHotReload.Tests.csproj --configuration Release --no-build
