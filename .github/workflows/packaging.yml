# Packaging lane for the Viu SDKs and shared-framework packs ([V01.01.12.19], generalized by
# [V01.01.12.02.02]). This is the one root that is not a per-project matrix: Install-Local.ps1 packs
# both base SDK -> targeting pack and Browser SDK -> targeting/runtime pack chains as one artifact set,
# below are about the SHAPE of that set, not about any one project. It replaces area-packaging.yml
# and keeps the cross-package artifact assertions in one place.
#
# Nothing here pushes: release.yml is the sole publisher of the checksummed, validated set.
name: Packaging

on:
  push:
    branches: [main]
    paths:
      - 'sdks/**'
      - 'frameworks/**'
      - 'extensions/dotnet/Assimalign.Viu.Templates/**'
      - 'scripts/**'
      - 'libraries/**'
      - 'tooling/**'
      - 'analyzers/**'
      - 'build/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.github/actions/**'
      - '.github/workflows/packaging.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/**'
      - 'frameworks/**'
      - 'extensions/dotnet/Assimalign.Viu.Templates/**'
      - 'scripts/**'
      - 'libraries/**'
      - 'tooling/**'
      - 'analyzers/**'
      - 'build/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.github/actions/**'
      - '.github/workflows/packaging.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pack:
    name: packaging (base + Browser SDK/framework)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The runtime pack builds the framework closure with -p:RuntimeIdentifier=browser-wasm,
      # which requires the wasm-tools workload (NETSDK1147 without it) — same as the app build.
      # This is the only lane in the repository that needs it: no Viu library targets browser-wasm.
      - name: Set up .NET (with wasm-tools)
        uses: ./.github/actions/setup-dotnet-wasm
        with:
          install-wasm-tools: 'true'

      # Install-Local.ps1 builds the SDK task hosts on its way to packing them, but not with warnings
      # as errors. Keep that gate explicit for both SDK segments.
      - name: Build base SDK task host (warnings are errors)
        run: dotnet build sdks/Assimalign.Viu.Sdk/Tasks/src/Assimalign.Viu.Sdk.Tasks.csproj --configuration Release -warnaserror

      - name: Build Browser SDK task host (warnings are errors)
        run: dotnet build sdks/Assimalign.Viu.Sdk.Browser/Tasks/src/Assimalign.Viu.Sdk.Browser.Tasks.csproj --configuration Release -warnaserror

      - name: Test Browser SDK CSS host-page injection
        run: dotnet test sdks/Assimalign.Viu.Sdk.Browser/Tasks/test/Assimalign.Viu.Sdk.Browser.Tasks.Tests.csproj --configuration Release -warnaserror

      - name: Pack SDKs and framework packs
        shell: pwsh
        run: ./scripts/Install-Local.ps1

      - name: Install and validate the Viu project templates
        shell: pwsh
        run: ./scripts/Test-Templates.ps1 -SkipPack

      - name: Validate release package metadata, ranges, analyzers, and symbols
        shell: pwsh
        run: |
          $sdkProject = 'sdks/Assimalign.Viu.Sdk/Tasks/src/Assimalign.Viu.Sdk.Tasks.csproj'
          $version = (& dotnet msbuild $sdkProject -nologo -getProperty:ViuVersion) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "Reading the canonical Viu version failed with exit code $LASTEXITCODE."
          }
          ./scripts/Test-Packages.ps1 -PackageDirectory _out/packages -Version $version.Trim()

      - name: Validate deterministic package payloads
        shell: pwsh
        run: |
          $project = 'libraries/Runtime/Assimalign.Viu.Components/src/Assimalign.Viu.Components.csproj'
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Resolving the repository commit failed.'
          }
          $first = Join-Path $PWD '_out/determinism/first'
          $second = Join-Path $PWD '_out/determinism/second'
          foreach ($output in @($first, $second)) {
            & dotnet clean $project --configuration Release
            if ($LASTEXITCODE -ne 0) {
              throw 'Cleaning the determinism canary failed.'
            }
            & dotnet pack $project `
              --configuration Release `
              --no-restore `
              -warnaserror `
              -p:ContinuousIntegrationBuild=true `
              "-p:RepositoryCommit=$commit" `
              "-p:PackageOutputPath=$output"
            if ($LASTEXITCODE -ne 0) {
              throw 'Packing the determinism canary failed.'
            }
          }
          $mainName = (Get-ChildItem $first -Filter '*.nupkg' -File).Name
          $symbolName = (Get-ChildItem $first -Filter '*.snupkg' -File).Name
          ./scripts/Test-PackageDeterminism.ps1 `
            -FirstPackage (Join-Path $first $mainName) `
            -SecondPackage (Join-Path $second $mainName)
          ./scripts/Test-PackageDeterminism.ps1 `
            -FirstPackage (Join-Path $first $symbolName) `
            -SecondPackage (Join-Path $second $symbolName)

      - name: Validate component-library and Browser package consumers
        shell: pwsh
        run: ./scripts/Test-ApplicationLifetimeConsumer.ps1

      - name: Validate installed-package .vue consumer
        shell: pwsh
        run: ./scripts/Test-PackagedVueConsumer.ps1 -SkipPack

      - name: Validate standalone UtilityCss package consumers
        shell: pwsh
        run: ./scripts/Test-UtilityCssPackage.ps1 -SkipPack

      - name: Verify no Node toolchain boundary
        shell: pwsh
        run: >-
          ./scripts/Test-NoNodeToolchain.ps1
          -Artifact (Get-ChildItem _out/packages -Filter '*.nupkg' | ForEach-Object FullName)

      - name: Assert package shapes
        shell: pwsh
        run: |
          $feed = "_out/packages"
          $expected = @(
            'Assimalign.Viu.Sdk.*.nupkg',
            'Assimalign.Viu.Sdk.Browser.*.nupkg',
            'Assimalign.Viu.App.Ref.*.nupkg',
            'Assimalign.Viu.App.Browser.Ref.*.nupkg',
            'Assimalign.Viu.App.Browser.Runtime.browser-wasm.*.nupkg',
            'Assimalign.Viu.UtilityCss.Build.*.nupkg',
            'Assimalign.Viu.Templates.*.nupkg'
          )
          foreach ($pattern in $expected) {
            if (-not (Get-ChildItem $feed -Filter $pattern)) { throw "Missing package: $pattern" }
          }

          $baseFrameworkAssemblies = @(
            'Assimalign.Viu.Components',
            'Assimalign.Viu.Core',
            'Assimalign.Viu.Reactivity',
            'Assimalign.Viu.State'
          )
          $browserReferenceFrameworkAssemblies = @(
            'Assimalign.Viu.Browser'
          )
          $browserRuntimeFrameworkAssemblies = @(
            $baseFrameworkAssemblies + $browserReferenceFrameworkAssemblies
          )
          $baseFrameworkPackageOverrides = @(
            'Assimalign.Viu.Components',
            'Assimalign.Viu.Reactivity',
            'Assimalign.Viu.State',
            'Assimalign.Viu.Core'
          )
          $browserFrameworkPackageOverrides = @(
            'Assimalign.Viu.Browser'
          )

          function Assert-FrameworkPackage {
            param(
              [Parameter(Mandatory)]
              [System.IO.FileInfo] $Package,
              [Parameter(Mandatory)]
              [string] $ManifestPath,
              [Parameter(Mandatory)]
              [string[]] $ExpectedFrameworkAssemblies,
              [string[]] $ExpectedPackageOverrides = @()
            )

            $archive = [System.IO.Compression.ZipFile]::OpenRead($Package.FullName)
            try {
              $manifestEntry = $archive.GetEntry($ManifestPath)
              if ($null -eq $manifestEntry) {
                throw "$($Package.Name) is missing $ManifestPath"
              }

              $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
              try {
                [xml] $manifest = $reader.ReadToEnd()
              }
              finally {
                $reader.Dispose()
              }

              $actualFrameworkAssemblies = @(
                $manifest.DocumentElement.File |
                  Where-Object Type -eq 'Managed' |
                  ForEach-Object AssemblyName |
                  Sort-Object
              )
              $difference = @(Compare-Object $expectedFrameworkAssemblies $actualFrameworkAssemblies)
              if ($difference.Count -ne 0) {
                throw "$($Package.Name) managed assembly manifest differs from the framework contract: $($difference | Out-String)"
              }

              foreach ($assemblyName in $expectedFrameworkAssemblies) {
                $assemblyFileName = "$assemblyName.dll"
                $matchingEntries = @($archive.Entries | Where-Object { $_.FullName.EndsWith("/$assemblyFileName", [System.StringComparison]::Ordinal) })
                if ($matchingEntries.Count -ne 1) {
                  throw "$($Package.Name) must contain exactly one $assemblyFileName, found $($matchingEntries.Count)"
                }
              }

              $packageOverridesEntry = $archive.GetEntry('data/PackageOverrides.txt')
              if ($ExpectedPackageOverrides.Count -eq 0) {
                if ($null -ne $packageOverridesEntry) {
                  throw "$($Package.Name) must not carry targeting-only data/PackageOverrides.txt"
                }
              }
              else {
                if ($null -eq $packageOverridesEntry) {
                  throw "$($Package.Name) is missing data/PackageOverrides.txt"
                }

                $nuspecEntries = @(
                  $archive.Entries |
                    Where-Object { $_.FullName.EndsWith('.nuspec', [System.StringComparison]::OrdinalIgnoreCase) }
                )
                if ($nuspecEntries.Count -ne 1) {
                  throw "$($Package.Name) must contain exactly one nuspec, found $($nuspecEntries.Count)"
                }

                $nuspecReader = [System.IO.StreamReader]::new($nuspecEntries[0].Open())
                try {
                  [xml] $nuspec = $nuspecReader.ReadToEnd()
                }
                finally {
                  $nuspecReader.Dispose()
                }
                $packageVersion = $nuspec.SelectSingleNode(
                  "//*[local-name()='metadata']/*[local-name()='version']").InnerText

                $packageOverridesReader = [System.IO.StreamReader]::new(
                  $packageOverridesEntry.Open())
                try {
                  $actualPackageOverrides = @(
                    $packageOverridesReader.ReadToEnd() -split '\r?\n' |
                      Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
                      Sort-Object
                  )
                }
                finally {
                  $packageOverridesReader.Dispose()
                }
                $expectedPackageOverrideLines = @(
                  $ExpectedPackageOverrides |
                    ForEach-Object { "$_|$packageVersion" } |
                    Sort-Object
                )
                $packageOverrideDifference = @(
                  Compare-Object $expectedPackageOverrideLines $actualPackageOverrides
                )
                if ($packageOverrideDifference.Count -ne 0) {
                  throw "$($Package.Name) package overrides differ from the framework contract: $($packageOverrideDifference | Out-String)"
                }
              }
            }
            finally {
              $archive.Dispose()
            }
          }

          function Get-SingleViuPackage {
            param([Parameter(Mandatory)][string] $PackageId)

            $escapedPackageId = [System.Text.RegularExpressions.Regex]::Escape($PackageId)
            $packages = @(
              Get-ChildItem $feed -Filter '*.nupkg' |
                Where-Object { $_.Name -match "^$escapedPackageId\.(?:0|[1-9][0-9]*)\." }
            )
            if ($packages.Count -ne 1) {
              throw "Expected exactly one $PackageId package, found $($packages.Count)"
            }

            return $packages[0]
          }

          $referencePackage = Get-SingleViuPackage -PackageId 'Assimalign.Viu.App.Ref'
          $browserReferencePackage = Get-SingleViuPackage -PackageId 'Assimalign.Viu.App.Browser.Ref'
          $runtimePackage = Get-SingleViuPackage -PackageId 'Assimalign.Viu.App.Browser.Runtime.browser-wasm'
          $sdkPackage = Get-SingleViuPackage -PackageId 'Assimalign.Viu.Sdk'
          $browserSdkPackage = Get-SingleViuPackage -PackageId 'Assimalign.Viu.Sdk.Browser'

          Assert-FrameworkPackage `
            -Package $referencePackage `
            -ManifestPath 'data/FrameworkList.xml' `
            -ExpectedFrameworkAssemblies $baseFrameworkAssemblies `
            -ExpectedPackageOverrides $baseFrameworkPackageOverrides
          Assert-FrameworkPackage `
            -Package $browserReferencePackage `
            -ManifestPath 'data/FrameworkList.xml' `
            -ExpectedFrameworkAssemblies $browserReferenceFrameworkAssemblies `
            -ExpectedPackageOverrides $browserFrameworkPackageOverrides
          Assert-FrameworkPackage `
            -Package $runtimePackage `
            -ManifestPath 'data/RuntimeList.xml' `
            -ExpectedFrameworkAssemblies $browserRuntimeFrameworkAssemblies

          # The ref pack's analyzer payload is the computed ProjectReference closure of the syntax
          # generator ([V01.01.06.11]): the shared projection core must ride along, and Roslyn must
          # not - PackageReference assets never enter _ResolvedProjectReferencePaths, so a
          # Microsoft.CodeAnalysis*.dll here means the closure mechanics regressed (the analyzer
          # host provides Roslyn; shipping a second copy would break generator loading).
          $referenceArchive = [System.IO.Compression.ZipFile]::OpenRead($referencePackage.FullName)
          try {
            $analyzerEntries = @(
              $referenceArchive.Entries |
                Where-Object { $_.FullName.StartsWith('analyzers/dotnet/cs/', [System.StringComparison]::Ordinal) } |
                ForEach-Object { $_.FullName.Substring('analyzers/dotnet/cs/'.Length) }
            )
            if ($analyzerEntries -notcontains 'Assimalign.Viu.Compiler.SingleFileComponent.dll') {
              throw "$($referencePackage.Name) analyzer payload is missing the shared projection core Assimalign.Viu.Compiler.SingleFileComponent.dll"
            }
            foreach ($generatorAssembly in @(
                'Assimalign.Viu.Generators.Reactivity.dll',
                'Assimalign.Viu.Generators.Syntax.dll')) {
              if ($analyzerEntries -notcontains $generatorAssembly) {
                throw "$($referencePackage.Name) analyzer payload is missing $generatorAssembly"
              }
            }
            $roslynEntries = @($analyzerEntries | Where-Object { $_ -like 'Microsoft.CodeAnalysis*.dll' })
            if ($roslynEntries.Count -ne 0) {
              throw "$($referencePackage.Name) analyzer payload must not carry host-provided Roslyn assemblies: $($roslynEntries -join ', ')"
            }
          }
          finally {
            $referenceArchive.Dispose()
          }

          $browserReferenceArchive = [System.IO.Compression.ZipFile]::OpenRead($browserReferencePackage.FullName)
          try {
            $browserAnalyzerEntries = @(
              $browserReferenceArchive.Entries |
                Where-Object { $_.FullName.StartsWith('analyzers/', [System.StringComparison]::Ordinal) }
            )
            if ($browserAnalyzerEntries.Count -ne 0) {
              throw "$($browserReferencePackage.Name) must not duplicate the base targeting pack's analyzers."
            }
          }
          finally {
            $browserReferenceArchive.Dispose()
          }

          function Assert-ArchiveEntries {
            param(
              [Parameter(Mandatory)] $Archive,
              [Parameter(Mandatory)] [System.IO.FileInfo] $Package,
              [Parameter(Mandatory)] [string[]] $EntryNames
            )

            foreach ($entryName in $EntryNames) {
              if ($null -eq $Archive.GetEntry($entryName)) {
                throw "$($Package.Name) is missing $entryName"
              }
            }
          }

          function Assert-NoArchiveEntries {
            param(
              [Parameter(Mandatory)] $Archive,
              [Parameter(Mandatory)] [System.IO.FileInfo] $Package,
              [Parameter(Mandatory)] [string[]] $EntryNames
            )

            foreach ($entryName in $EntryNames) {
              if ($null -ne $Archive.GetEntry($entryName)) {
                throw "$($Package.Name) must not contain $entryName"
              }
            }
          }

          function Read-PackageNuspec {
            param(
              [Parameter(Mandatory)] $Archive,
              [Parameter(Mandatory)] [System.IO.FileInfo] $Package
            )

            $nuspecEntries = @(
              $Archive.Entries |
                Where-Object { $_.FullName.EndsWith('.nuspec', [System.StringComparison]::OrdinalIgnoreCase) }
            )
            if ($nuspecEntries.Count -ne 1) {
              throw "$($Package.Name) must contain exactly one nuspec, found $($nuspecEntries.Count)"
            }

            $reader = [System.IO.StreamReader]::new($nuspecEntries[0].Open())
            try {
              return [xml] $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }
          }

          function Read-ArchiveEntryText {
            param(
              [Parameter(Mandatory)] $Archive,
              [Parameter(Mandatory)] [System.IO.FileInfo] $Package,
              [Parameter(Mandatory)] [string] $EntryName
            )

            $entry = $Archive.GetEntry($EntryName)
            if ($null -eq $entry) {
              throw "$($Package.Name) is missing $EntryName"
            }

            $reader = [System.IO.StreamReader]::new($entry.Open())
            try {
              return $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }
          }

          $parkedCssAddOnName = 'Utility' + 'Css'
          $parkedCssAddOnEntries = @(
            "Tasks/Assimalign.Viu.$parkedCssAddOnName.dll",
            "Tasks/Assimalign.Viu.$parkedCssAddOnName.THIRD-PARTY-NOTICES.md",
            "Targets/Assimalign.Viu.Sdk.$parkedCssAddOnName.targets",
            "Targets/Assimalign.Viu.Sdk.Browser.$parkedCssAddOnName.targets"
          )

          $sdkArchive = [System.IO.Compression.ZipFile]::OpenRead($sdkPackage.FullName)
          try {
            Assert-ArchiveEntries `
              -Archive $sdkArchive `
              -Package $sdkPackage `
              -EntryNames @(
                'Assimalign.Viu.Sdk.nuspec',
                'Sdk/Sdk.props',
                'Sdk/Sdk.targets',
                'Tasks/Assimalign.Viu.Sdk.Tasks.dll',
                'Tasks/Assimalign.Viu.Sdk.Tasks.deps.json',
                'Tasks/Assimalign.Viu.Syntax.dll',
                'Tasks/Assimalign.Viu.Syntax.Css.dll',
                'Tasks/Assimalign.Viu.Syntax.SingleFileComponent.dll',
                'Tasks/Assimalign.Viu.Syntax.Templates.dll',
                'Tasks/Assimalign.Viu.Compiler.Css.dll',
                'Targets/Assimalign.Viu.Generators.Syntax.props',
                'Targets/Assimalign.Viu.Generators.Syntax.targets',
                'Targets/Assimalign.Viu.Sdk.ComponentStyles.targets'
              )
            Assert-NoArchiveEntries `
              -Archive $sdkArchive `
              -Package $sdkPackage `
              -EntryNames (@(
                'Targets/Assimalign.Viu.Sdk.Css.HotReload.targets',
                'Targets/Assimalign.Viu.Sdk.StaticWebAssets.targets',
                'Targets/Assimalign.Viu.Sdk.WebAssembly.targets',
                'Targets/Assimalign.Viu.Sdk.Browser.Css.Bundling.targets',
                'Targets/Assimalign.Viu.Sdk.Browser.ComponentStyles.targets',
                'Targets/Assimalign.Viu.Sdk.Browser.FrameworkReference.props',
                'Targets/Assimalign.Viu.Sdk.Browser.FrameworkReference.targets',
                'Targets/Assimalign.Viu.Sdk.Browser.Css.HotReload.targets',
                'Targets/Assimalign.Viu.Sdk.Browser.StaticWebAssets.targets',
                'Targets/Assimalign.Viu.Sdk.Browser.WebAssembly.targets',
                'Watch/Assimalign.Viu.Sdk.CssHotReload.dll',
                'RunHost/Assimalign.Viu.Sdk.Browser.RunHost.dll',
                'assets/Assimalign.Viu.Browser/viu-dom.js'
              ) + $parkedCssAddOnEntries)

            $baseBrowserPayload = @(
              $sdkArchive.Entries |
                Where-Object {
                  $_.FullName.StartsWith('Watch/', [System.StringComparison]::Ordinal) -or
                  $_.FullName.StartsWith('RunHost/', [System.StringComparison]::Ordinal) -or
                  $_.FullName.StartsWith('assets/', [System.StringComparison]::Ordinal)
                }
            )
            if ($baseBrowserPayload.Count -ne 0) {
              throw "$($sdkPackage.Name) must not carry Browser Watch/RunHost/assets payload."
            }

            $baseSdkProps = Read-ArchiveEntryText `
              -Archive $sdkArchive `
              -Package $sdkPackage `
              -EntryName 'Sdk/Sdk.props'
            $baseSdkTargets = Read-ArchiveEntryText `
              -Archive $sdkArchive `
              -Package $sdkPackage `
              -EntryName 'Sdk/Sdk.targets'
            if (-not $baseSdkProps.Contains(
                '<Import Sdk="Microsoft.NET.Sdk" Project="Sdk.props"',
                [System.StringComparison]::Ordinal) -or
                -not $baseSdkTargets.Contains(
                '<Import Sdk="Microsoft.NET.Sdk" Project="Sdk.targets"',
                [System.StringComparison]::Ordinal)) {
              throw "$($sdkPackage.Name) must chain the host-neutral Microsoft.NET.Sdk props and targets."
            }
            if ($baseSdkProps.Contains(
                'Microsoft.NET.Sdk.WebAssembly',
                [System.StringComparison]::Ordinal) -or
                $baseSdkTargets.Contains(
                'Microsoft.NET.Sdk.WebAssembly',
                [System.StringComparison]::Ordinal)) {
              throw "$($sdkPackage.Name) must not import Microsoft.NET.Sdk.WebAssembly."
            }

            $baseNuspec = Read-PackageNuspec -Archive $sdkArchive -Package $sdkPackage
            $baseDependencies = @($baseNuspec.SelectNodes("//*[local-name()='dependency']"))
            if ($baseDependencies.Count -ne 0) {
              throw "$($sdkPackage.Name) must not expose implementation dependencies: $($baseDependencies.id -join ', ')"
            }
          }
          finally {
            $sdkArchive.Dispose()
          }

          $browserSdkArchive = [System.IO.Compression.ZipFile]::OpenRead($browserSdkPackage.FullName)
          try {
            Assert-ArchiveEntries `
              -Archive $browserSdkArchive `
              -Package $browserSdkPackage `
              -EntryNames @(
                'Assimalign.Viu.Sdk.Browser.nuspec',
                'Sdk/Sdk.props',
                'Sdk/Sdk.targets',
                'Tasks/Assimalign.Viu.Sdk.Browser.Tasks.dll',
                'Tasks/Assimalign.Viu.Sdk.Browser.Tasks.deps.json',
                'Targets/Assimalign.Viu.Sdk.Browser.Common.props',
                'Targets/Assimalign.Viu.Sdk.Browser.Css.Bundling.targets',
                'Targets/Assimalign.Viu.Sdk.Browser.ComponentStyles.targets',
                'Targets/Assimalign.Viu.Sdk.Browser.FrameworkReference.props',
                'Targets/Assimalign.Viu.Sdk.Browser.FrameworkReference.targets',
                'Targets/Assimalign.Viu.Sdk.Browser.Css.HotReload.targets',
                'Targets/Assimalign.Viu.Sdk.Browser.StaticWebAssets.targets',
                'Targets/Assimalign.Viu.Sdk.Browser.WebAssembly.targets',
                'Watch/Assimalign.Viu.Sdk.CssHotReload.dll',
                'Watch/Assimalign.Viu.Sdk.CssHotReload.deps.json',
                'Watch/Assimalign.Viu.Sdk.CssHotReload.runtimeconfig.json',
                'RunHost/Assimalign.Viu.Sdk.Browser.RunHost.dll',
                'RunHost/Assimalign.Viu.Sdk.Browser.RunHost.deps.json',
                'RunHost/Assimalign.Viu.Sdk.Browser.RunHost.runtimeconfig.json',
                'assets/Assimalign.Viu.Browser/viu-dom.js'
              )
            Assert-NoArchiveEntries `
              -Archive $browserSdkArchive `
              -Package $browserSdkPackage `
              -EntryNames (@(
                'Tasks/Assimalign.Viu.Sdk.Tasks.dll',
                'Tasks/Assimalign.Viu.Syntax.dll',
                'Tasks/Assimalign.Viu.Syntax.SingleFileComponent.dll',
                'Targets/Assimalign.Viu.Generators.Syntax.props',
                'Targets/Assimalign.Viu.Generators.Syntax.targets',
                'Targets/Assimalign.Viu.Sdk.ComponentStyles.targets'
              ) + $parkedCssAddOnEntries)

            $expectedWatchEntries = @(
              'Watch/Assimalign.Viu.Sdk.CssHotReload.deps.json',
              'Watch/Assimalign.Viu.Sdk.CssHotReload.dll',
              'Watch/Assimalign.Viu.Sdk.CssHotReload.runtimeconfig.json'
            ) | Sort-Object
            $actualWatchEntries = @(
              $browserSdkArchive.Entries |
                ForEach-Object FullName |
                Where-Object {
                  $_.StartsWith('Watch/', [System.StringComparison]::Ordinal)
                } |
                Sort-Object
            )
            $watchDifference = @(Compare-Object $expectedWatchEntries $actualWatchEntries)
            if ($watchDifference.Count -ne 0) {
              throw "$($browserSdkPackage.Name) Watch payload differs from the platform-neutral worker contract: $($watchDifference | Out-String)"
            }

            $expectedRunHostEntries = @(
              'RunHost/Assimalign.Viu.Sdk.Browser.RunHost.deps.json',
              'RunHost/Assimalign.Viu.Sdk.Browser.RunHost.dll',
              'RunHost/Assimalign.Viu.Sdk.Browser.RunHost.runtimeconfig.json'
            ) | Sort-Object
            $actualRunHostEntries = @(
              $browserSdkArchive.Entries |
                ForEach-Object FullName |
                Where-Object {
                  $_.StartsWith('RunHost/', [System.StringComparison]::Ordinal)
                } |
                Sort-Object
            )
            $runHostDifference = @(Compare-Object $expectedRunHostEntries $actualRunHostEntries)
            if ($runHostDifference.Count -ne 0) {
              throw "$($browserSdkPackage.Name) RunHost payload differs from the platform-neutral readiness-launcher contract: $($runHostDifference | Out-String)"
            }

            $browserSdkProps = Read-ArchiveEntryText `
              -Archive $browserSdkArchive `
              -Package $browserSdkPackage `
              -EntryName 'Sdk/Sdk.props'
            if (-not $browserSdkProps.Contains(
                'Assimalign.Viu.Sdk.Browser.FrameworkReference.props',
                [System.StringComparison]::Ordinal)) {
              throw "$($browserSdkPackage.Name) Sdk.props must import the Browser framework-reference props."
            }
            if (-not $browserSdkProps.Contains(
                'Assimalign.Viu.Sdk.Browser.Common.props',
                [System.StringComparison]::Ordinal)) {
              throw "$($browserSdkPackage.Name) Sdk.props must import the Browser common props."
            }
            if (-not $browserSdkProps.Contains(
                '<Import Sdk="Assimalign.Viu.Sdk" Project="Sdk.props"',
                [System.StringComparison]::Ordinal)) {
              throw "$($browserSdkPackage.Name) Sdk.props must import the base SDK props."
            }

            $browserSdkTargets = Read-ArchiveEntryText `
              -Archive $browserSdkArchive `
              -Package $browserSdkPackage `
              -EntryName 'Sdk/Sdk.targets'
            if (-not $browserSdkTargets.Contains(
                'Assimalign.Viu.Sdk.Browser.FrameworkReference.targets',
                [System.StringComparison]::Ordinal)) {
              throw "$($browserSdkPackage.Name) Sdk.targets must import the Browser framework-reference targets."
            }
            if (-not $browserSdkTargets.Contains(
                'Assimalign.Viu.Sdk.Browser.WebAssembly.targets',
                [System.StringComparison]::Ordinal)) {
              throw "$($browserSdkPackage.Name) Sdk.targets must import the Browser WebAssembly targets."
            }
            if (-not $browserSdkTargets.Contains(
                '<Import Sdk="Assimalign.Viu.Sdk" Project="Sdk.targets"',
                [System.StringComparison]::Ordinal)) {
              throw "$($browserSdkPackage.Name) Sdk.targets must import the base SDK targets."
            }

            $browserCommonProps = Read-ArchiveEntryText `
              -Archive $browserSdkArchive `
              -Package $browserSdkPackage `
              -EntryName 'Targets/Assimalign.Viu.Sdk.Browser.Common.props'
            if (-not $browserCommonProps.Contains(
                'ViuBrowserRunHostAssembly',
                [System.StringComparison]::Ordinal) -or
                -not $browserCommonProps.Contains(
                  'RunHost\Assimalign.Viu.Sdk.Browser.RunHost.dll',
                  [System.StringComparison]::Ordinal)) {
              throw "$($browserSdkPackage.Name) Browser common props must locate the packaged run host."
            }

            $browserNuspec = Read-PackageNuspec `
              -Archive $browserSdkArchive `
              -Package $browserSdkPackage
            $browserVersion = $browserNuspec.SelectSingleNode(
              "//*[local-name()='metadata']/*[local-name()='version']").InnerText
            $browserDependencies = @($browserNuspec.SelectNodes("//*[local-name()='dependency']"))
            if ($browserDependencies.Count -ne 1 -or
                $browserDependencies[0].id -ne 'Assimalign.Viu.Sdk' -or
                $browserDependencies[0].version -ne "[$browserVersion]") {
              throw "$($browserSdkPackage.Name) must depend only on exact-version Assimalign.Viu.Sdk [$browserVersion]."
            }
          }
          finally {
            $browserSdkArchive.Dispose()
          }

          foreach ($package in @($sdkPackage, $browserSdkPackage)) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              Assert-NoArchiveEntries `
                -Archive $archive `
                -Package $package `
                -EntryNames @(
                  'Tasks/Microsoft.Build.dll',
                  'Tasks/Microsoft.Build.Framework.dll',
                  'Tasks/Microsoft.Build.Utilities.Core.dll',
                  'Tasks/Microsoft.NET.StringTools.dll',
                  'Tasks/Assimalign.Viu.Compiler.SingleFileComponent.dll',
                  'Targets/Assimalign.Viu.Syntax.Generators.props',
                  'Targets/Assimalign.Viu.Syntax.Generators.targets'
                )

              $taskRoslynEntries = @(
                $archive.Entries |
                  Where-Object {
                    $_.FullName.StartsWith('Tasks/', [System.StringComparison]::Ordinal) -and
                    $_.Name -like 'Microsoft.CodeAnalysis*.dll'
                  } |
                  ForEach-Object FullName
              )
              if ($taskRoslynEntries.Count -ne 0) {
                throw "$($package.Name) must not carry host-provided Roslyn assemblies: $($taskRoslynEntries -join ', ')"
              }
            }
            finally {
              $archive.Dispose()
            }
          }

          Get-ChildItem $feed -Filter 'Assimalign.Viu.*.nupkg' | ForEach-Object { Write-Host $_.Name }

  component-library-no-wasm:
    name: packaging (component library, no wasm workload)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up .NET (no wasm-tools)
        uses: ./.github/actions/setup-dotnet-wasm

      - name: Pack the host-neutral SDK/framework path
        shell: pwsh
        run: ./scripts/Install-Local.ps1 -BaseOnly -SkipCachePrune

      - name: Build and pack component library
        shell: pwsh
        run: ./scripts/Test-ApplicationLifetimeConsumer.ps1 -ComponentLibraryOnly

  sdk-tests:
    # The CSS hot-reload worker under sdks/ has a test project that no retired workflow ever ran: it
    # is in no per-area solution file, and area-packaging only invoked Install-Local.ps1. Generalizing
    # the pipelines is the moment to close that hole.
    name: packaging (SDK tests)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet-wasm

      - name: Build CSS hot-reload worker (warnings are errors)
        run: dotnet build sdks/Assimalign.Viu.Sdk.Browser/Watch/test/Assimalign.Viu.Sdk.CssHotReload.Tests.csproj --configuration Release -warnaserror

      - name: Test CSS hot-reload worker
        run: dotnet test sdks/Assimalign.Viu.Sdk.Browser/Watch/test/Assimalign.Viu.Sdk.CssHotReload.Tests.csproj --configuration Release --no-build

      - name: Build Browser run host (warnings are errors)
        run: dotnet build sdks/Assimalign.Viu.Sdk.Browser/RunHost/test/Assimalign.Viu.Sdk.Browser.RunHost.Tests.csproj --configuration Release -warnaserror

      - name: Test Browser run host
        run: dotnet test sdks/Assimalign.Viu.Sdk.Browser/RunHost/test/Assimalign.Viu.Sdk.Browser.RunHost.Tests.csproj --configuration Release --no-build
