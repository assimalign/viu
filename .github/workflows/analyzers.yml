# Build+test lane for the Viu source generators ([V01.01.12.02.02]). The generators ship inside the
# Assimalign.Viu.App targeting pack rather than as standalone NuGet packages, so this root never
# publishes and the job keeps contents:read only.
#
# Matrix rows name the project and carry its explicit repository-relative folder path. The shared
# build action discovers the shipping project inside that folder, so the Reactive folder can still
# hold the Assimalign.Viu.Generators.Reactivity assembly without a special case.
name: Analyzers

on:
    push:
        branches: [main]
        paths:
            - "analyzers/**"
            # The reactivity generator compiles against the Reactivity runtime library; the syntax
            # generator is the composition root of the Syntax cluster and of the shared projection
            # core under libraries/Syntax and tooling/Compiler.
            - "libraries/**"
            - "tooling/**"
            - "build/**"
            - "Directory.Build.props"
            - "Directory.Build.targets"
            - "global.json"
            - "nuget.config"
            - ".github/actions/**"
            - ".github/workflows/analyzers.yml"
    pull_request:
        branches: [main]
        paths:
            - "analyzers/**"
            - "libraries/**"
            - "tooling/**"
            - "build/**"
            - "Directory.Build.props"
            - "Directory.Build.targets"
            - "global.json"
            - "nuget.config"
            - ".github/actions/**"
            - ".github/workflows/analyzers.yml"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    build:
        name: analyzers (${{ matrix.project }})
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - project: "Assimalign.Viu.Generators.Reactive"
                      path: "analyzers/Assimalign.Viu.Generators.Reactive"
                    - project: "Assimalign.Viu.Generators.Syntax"
                      path: "analyzers/Assimalign.Viu.Generators.Syntax"
        steps:
            - name: "Checkout: ${{ matrix.project }}"
              # actions/checkout v4
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: "Build: ${{ matrix.project }}"
              uses: ./.github/actions/build
              with:
                  project-path: ${{ matrix.path }}
