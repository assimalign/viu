# Type-check lane for the Visual Studio Code extension client ([V01.01.12.02.02]).
#
# NEW COVERAGE: none of the fifteen retired per-area workflows watched
# extensions/VisualStudioCode at all, so a package's TypeScript client could break without CI
# noticing. This is deliberately the cheap half of each package Build.ps1 — `npm ci` plus the
# package's own `check` script (tsc --noEmit). Publishing self-contained language-server payloads
# for five runtime identifiers remains in the extension build/release gates; duplicating it in this
# client lane would add minutes of runtime without improving TypeScript coverage.
#
# Node comes preinstalled on the GitHub-hosted runner image, so this lane pins no third-party action
# beyond the checkout.
name: Visual Studio Code

on:
    push:
        branches: [main]
        paths:
            - "extensions/VisualStudioCode/**"
            - ".github/workflows/visual-studio-code.yml"
    pull_request:
        branches: [main]
        paths:
            - "extensions/VisualStudioCode/**"
            - ".github/workflows/visual-studio-code.yml"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    build:
        name: ${{ matrix.package }} (client)
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - package: viu
                      path: extensions/VisualStudioCode/packages/viu
                    - package: viu-utilitycss
                      path: extensions/VisualStudioCode/packages/viu-utilitycss
        steps:
            - name: Checkout
              # actions/checkout v4
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false

            - name: Install client dependencies
              run: npm ci
              working-directory: ${{ matrix.path }}

            - name: Type-check client
              run: npm run check
              working-directory: ${{ matrix.path }}
