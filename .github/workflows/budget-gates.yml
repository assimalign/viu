# WASM size, trimming, and AOT budget gates ([V01.01.12.06], #95): the Viu analog of
# vuejs/core's size-check job (https://github.com/vuejs/core/blob/main/.github/workflows/size-data.yml).
# The packaged-consumer showcase lives in assimalign/viu-examples. Consumer lanes check both
# repositories out as siblings so its nuget.config resolves only the packages built into
# viu/_out/packages, exactly like the supported local development loop.
name: budget-gates

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'libraries/**'
      - 'frameworks/**'
      - 'sdks/**'
      - 'analyzers/**'
      - 'build/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - 'scripts/Measure-PublishBudget.ps1'
      - 'scripts/budgets/**'
      - 'scripts/tests/**'
      - '.github/actions/**'
      - '.github/workflows/budget-gates.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'libraries/**'
      - 'frameworks/**'
      - 'sdks/**'
      - 'analyzers/**'
      - 'build/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - 'scripts/Measure-PublishBudget.ps1'
      - 'scripts/budgets/**'
      - 'scripts/tests/**'
      - '.github/actions/**'
      - '.github/workflows/budget-gates.yml'

permissions:
  contents: read

jobs:
  gate-tests:
    name: budget gate tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet-wasm

      # Fast, hermetic coverage of the gate's measurement/exclusion/gating logic.
      # No publish here, so this lane needs no wasm-tools workload.
      - name: Build + test the budget gate
        run: dotnet test scripts/tests/Assimalign.Viu.PublishBudget.Tests/Assimalign.Viu.PublishBudget.Tests.csproj --configuration Release -warnaserror

  size:
    name: publish-size + trimming gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Viu
        uses: actions/checkout@v4
        with:
          path: viu

      - name: Checkout packaged-consumer showcase
        uses: actions/checkout@v4
        with:
          repository: assimalign/viu-examples
          path: viu-examples

      # This conditional exists only to make the initial cross-repository migration mergeable:
      # Viu lands first, then viu-examples can consume it. Once the external showcase is on main,
      # this probe remains true and every subsequent Viu run enforces the gate normally.
      - name: Detect packaged-consumer showcase
        id: showcase
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE `
            'viu-examples/examples/Assimalign.Viu.Showcase/Assimalign.Viu.Showcase.csproj'
          $available = Test-Path -LiteralPath $project
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $available) {
            Write-Warning 'The external showcase has not landed yet; skipping this migration run.'
          }

      - name: Set up .NET (with wasm-tools)
        if: steps.showcase.outputs.available == 'true'
        uses: ./viu/.github/actions/setup-dotnet-wasm
        with:
          repository-path: viu
          install-wasm-tools: 'true'

      # The SDK target packs every shipping library so the showcase's opt-in Router
      # PackageReferences also resolve from the local feed. The framework packs provide
      # the implicit Assimalign.Viu.App framework reference used by the app SDK.
      - name: Pack local SDK, libraries, and framework
        if: steps.showcase.outputs.available == 'true'
        shell: pwsh
        run: |
          $feed = Join-Path $env:GITHUB_WORKSPACE 'viu/_out/packages'
          dotnet pack ./viu/sdks/Assimalign.Viu.Sdk/Tasks/Assimalign.Viu.Sdk.Tasks.csproj `
            --configuration Release `
            -p:PackViuProjects=true `
            "-p:PackageOutputPath=$feed"
          if ($LASTEXITCODE -ne 0) { throw 'SDK and library pack failed.' }

          dotnet pack ./viu/frameworks/Assimalign.Viu.App.Runtime/src/Assimalign.Viu.App.Runtime.csproj `
            --configuration Release `
            -p:RuntimeIdentifier=browser-wasm `
            "-p:PackageOutputPath=$feed"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime pack failed.' }

          dotnet pack ./viu/frameworks/Assimalign.Viu.App.Refs/src/Assimalign.Viu.App.Refs.csproj `
            --configuration Release `
            "-p:PackageOutputPath=$feed"
          if ($LASTEXITCODE -ne 0) { throw 'Reference pack failed.' }

      # Publishing with warnings as errors makes this both the payload-size gate and
      # the trimming gate. The external project enables PublishTrimmed and full
      # per-warning reporting; the manifest is the only place budgets are raised.
      - name: Publish (trimmed), measure size, enforce budget
        if: steps.showcase.outputs.available == 'true'
        shell: pwsh
        run: >-
          ./viu/scripts/Measure-PublishBudget.ps1
          -RepositoryRoot ./viu
          -ResultsPath ./viu/_out/budgets/head-results.json

      - name: Upload measurement results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-budget-results
          path: viu/_out/budgets/head-results.json
          if-no-files-found: ignore

  aot:
    name: AOT compilation lane (optional)
    # Optional cost-control lane. Runs on pushes to main and release branches, and
    # on pull requests only when labelled 'aot-gate'.
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'aot-gate')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Viu
        uses: actions/checkout@v4
        with:
          path: viu

      - name: Checkout packaged-consumer showcase
        uses: actions/checkout@v4
        with:
          repository: assimalign/viu-examples
          path: viu-examples

      - name: Detect packaged-consumer showcase
        id: showcase
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE `
            'viu-examples/examples/Assimalign.Viu.Showcase/Assimalign.Viu.Showcase.csproj'
          $available = Test-Path -LiteralPath $project
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $available) {
            Write-Warning 'The external showcase has not landed yet; skipping this migration run.'
          }

      - name: Set up .NET (with wasm-tools)
        if: steps.showcase.outputs.available == 'true'
        uses: ./viu/.github/actions/setup-dotnet-wasm
        with:
          repository-path: viu
          install-wasm-tools: 'true'

      - name: Pack local SDK, libraries, and framework
        if: steps.showcase.outputs.available == 'true'
        shell: pwsh
        run: |
          $feed = Join-Path $env:GITHUB_WORKSPACE 'viu/_out/packages'
          dotnet pack ./viu/sdks/Assimalign.Viu.Sdk/Tasks/Assimalign.Viu.Sdk.Tasks.csproj `
            --configuration Release `
            -p:PackViuProjects=true `
            "-p:PackageOutputPath=$feed"
          if ($LASTEXITCODE -ne 0) { throw 'SDK and library pack failed.' }

          dotnet pack ./viu/frameworks/Assimalign.Viu.App.Runtime/src/Assimalign.Viu.App.Runtime.csproj `
            --configuration Release `
            -p:RuntimeIdentifier=browser-wasm `
            "-p:PackageOutputPath=$feed"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime pack failed.' }

          dotnet pack ./viu/frameworks/Assimalign.Viu.App.Refs/src/Assimalign.Viu.App.Refs.csproj `
            --configuration Release `
            "-p:PackageOutputPath=$feed"
          if ($LASTEXITCODE -ne 0) { throw 'Reference pack failed.' }

      - name: Publish showcase with AOT compilation
        if: steps.showcase.outputs.available == 'true'
        run: >-
          dotnet publish
          ./viu-examples/examples/Assimalign.Viu.Showcase/Assimalign.Viu.Showcase.csproj
          --configuration Release
          -p:ViuRunAotCompilation=true
          -warnaserror
          --output ./viu/_out/budgets/aot

  startup:
    name: startup-time gate (deferred, #87)
    # WIRED-BUT-SKIPPED. Real startup timing must include browser and JS-interop
    # initialization, so this remains disabled until the Playwright harness lands.
    if: ${{ vars.ENABLE_STARTUP_GATE == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Startup gate placeholder
        shell: pwsh
        run: |
          Write-Host 'Startup-time gate is deferred pending the Playwright e2e harness ([V01.01.11.03], #87).'
          Write-Host 'Enable by setting repository variable ENABLE_STARTUP_GATE=true once the harness lands.'
