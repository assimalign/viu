# Browser publish budgets ([V01.01.12.06], #95), restored to live CI by
# [V01.01.12.26] (#320) with the real-browser startup lane from
# [V01.01.12.06.01] (#182). Budgets and their measured provenance live in
# scripts/budgets/PublishBudgets.json; CI never rewrites that manifest.
#
# Cost split:
#   - Every relevant pull request and push runs the hermetic checker tests and one
#     normal trimmed publish. This enforces payload size and trim warnings without
#     paying for WebAssembly AOT compilation or browser repetition.
#   - The explicit AOT publish and real-browser startup gate run on the weekly
#     schedule and workflow_dispatch. Startup includes one warm-up plus at least
#     ten measured Chromium boots, so it is intentionally not a per-PR lane.
#   - Deterministic interop-count budgets remain a cheap per-PR gate in
#     benchmarks.yml against benchmarks/baselines/InteropCounts.json [RND-IO-5].
name: budget-gates

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
  push:
    branches: [main, 'release/**']
    paths:
      - 'libraries/**'
      - 'tooling/**'
      - 'analyzers/**'
      - 'frameworks/**'
      - 'sdks/**'
      - 'build/**'
      - 'benchmarks/Assimalign.Viu.Testing.EndToEnd/**'
      - 'scripts/fixtures/EndToEnd*/**'
      - 'scripts/Install-Local.ps1'
      - 'scripts/Measure-PublishBudget.ps1'
      - 'scripts/Test-EndToEnd.ps1'
      - 'scripts/Test-StartupBudget.ps1'
      - 'scripts/budgets/**'
      - 'scripts/modules/**'
      - 'scripts/tests/Assimalign.Viu.PublishBudget.Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.github/actions/**'
      - '.github/workflows/budget-gates.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'libraries/**'
      - 'tooling/**'
      - 'analyzers/**'
      - 'frameworks/**'
      - 'sdks/**'
      - 'build/**'
      - 'benchmarks/Assimalign.Viu.Testing.EndToEnd/**'
      - 'scripts/fixtures/EndToEnd*/**'
      - 'scripts/Install-Local.ps1'
      - 'scripts/Measure-PublishBudget.ps1'
      - 'scripts/Test-EndToEnd.ps1'
      - 'scripts/Test-StartupBudget.ps1'
      - 'scripts/budgets/**'
      - 'scripts/modules/**'
      - 'scripts/tests/Assimalign.Viu.PublishBudget.Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.github/actions/**'
      - '.github/workflows/budget-gates.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate-tests:
    name: budget checker tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet-wasm

      - name: Build and test budget checkers
        run: >-
          dotnet test
          scripts/tests/Assimalign.Viu.PublishBudget.Tests/Assimalign.Viu.PublishBudget.Tests.csproj
          --configuration Release
          -warnaserror

  size:
    name: publish-size and trimming gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # A second build is intentionally avoided: the base revision's reviewed
      # measured value supplies the informational delta while the head revision
      # alone is packed and published. The first restoration PR falls back to the
      # head manifest because the old base manifest has no measured-baseline field.
      - name: Checkout base budget manifest
        if: github.event_name == 'pull_request'
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: budget-base
          persist-credentials: false
          sparse-checkout: scripts/budgets/PublishBudgets.json
          sparse-checkout-cone-mode: 'false'

      - name: Set up .NET with wasm-tools
        uses: ./.github/actions/setup-dotnet-wasm
        with:
          install-wasm-tools: 'true'

      # The tracked fixture is a package consumer of Assimalign.Viu.Sdk.Browser.
      # Test-EndToEnd isolates its SDK version, local feed, cache, restore, and
      # publish. A normal trimmed publish is deliberate; AOT has its own lane.
      - name: Publish isolated trimmed fixture
        shell: pwsh
        run: >-
          ./scripts/Test-EndToEnd.ps1
          -PublishOnly
          -PublishDirectory ./_out/budgets/trimmed

      - name: Measure trimmed fixture and enforce budget
        shell: pwsh
        run: |
          $parameters = @{
            RepositoryRoot = '.'
            SampleName = 'EndToEndBrowserApp'
            PublishDirectory = './_out/budgets/trimmed'
            ResultsPath = './_out/budgets/publish-results.json'
          }
          $baseManifest = './budget-base/scripts/budgets/PublishBudgets.json'
          if (Test-Path -LiteralPath $baseManifest) {
            $parameters.BaselineManifestPath = $baseManifest
          }
          ./scripts/Measure-PublishBudget.ps1 @parameters

      - name: Upload publish measurement
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publish-budget-results
          path: _out/budgets/publish-results.json
          if-no-files-found: ignore

  aot:
    name: AOT compilation lane
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up .NET with wasm-tools
        uses: ./.github/actions/setup-dotnet-wasm
        with:
          install-wasm-tools: 'true'

      - name: Publish fixture with AOT compilation
        shell: pwsh
        run: >-
          ./scripts/Test-EndToEnd.ps1
          -PublishOnly
          -PublishDirectory ./_out/budgets/aot
          -Aot

  startup:
    name: startup-time gate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # A manual run from a topic branch compares with the default branch's
      # reviewed startup calibration. A scheduled default-branch run compares
      # with that same reviewed baseline without doubling the browser workload.
      - name: Checkout base budget manifest
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: budget-base
          persist-credentials: false
          sparse-checkout: scripts/budgets/PublishBudgets.json
          sparse-checkout-cone-mode: 'false'

      - name: Set up .NET with wasm-tools
        uses: ./.github/actions/setup-dotnet-wasm
        with:
          install-wasm-tools: 'true'

      # Test-EndToEnd owns the package-consumer build, trimmed publish, static
      # server, Chromium lifecycle, and boot-to-interactive marker. The checker
      # independently validates its stable JSON and recomputes the median.
      - name: Measure real-browser startup
        shell: pwsh
        run: >-
          ./scripts/Test-EndToEnd.ps1
          -MeasureStartup
          -StartupResultsPath ./_out/budgets/startup-results.json
          -StartupWarmupRuns 1
          -StartupMeasuredRuns 10

      - name: Enforce startup budget
        shell: pwsh
        run: >-
          ./scripts/Test-StartupBudget.ps1
          -ResultsPath ./_out/budgets/startup-results.json
          -BaselineManifestPath ./budget-base/scripts/budgets/PublishBudgets.json

      - name: Upload startup measurement
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: startup-budget-results
          path: _out/budgets/startup-results.json
          if-no-files-found: ignore
