# Standalone build and test lane for Viu Utilities. The engine is shared by the
# source-generator/MSBuild compiler hosts and the full Visual Studio language service, but remains
# independently testable and has no Tailwind, Node, or runtime-framework dependency.
name: area-utility-css

on:
  push:
    branches: [main]
    paths:
      - 'libraries/Assimalign.Viu.Tooling.UtilityCss/**'
      - 'libraries/Assimalign.Viu.Syntax*/**'
      - 'sdks/Assimalign.Viu.Sdk/**'
      - 'build/**'
      - 'scripts/Test-UtilityCssArtifactShape.ps1'
      - 'scripts/Test-UtilityCssIndependence.ps1'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.github/actions/**'
      - '.github/workflows/area-utility-css.yml'
  pull_request:
    branches: [main]
    paths:
      - 'libraries/Assimalign.Viu.Tooling.UtilityCss/**'
      - 'libraries/Assimalign.Viu.Syntax*/**'
      - 'sdks/Assimalign.Viu.Sdk/**'
      - 'build/**'
      - 'scripts/Test-UtilityCssArtifactShape.ps1'
      - 'scripts/Test-UtilityCssIndependence.ps1'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.github/actions/**'
      - '.github/workflows/area-utility-css.yml'

permissions:
  contents: read

jobs:
  build-test:
    name: build and test Viu Utilities
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet-wasm

      - name: Build utility engine (warnings are errors)
        run: >-
          dotnet build
          libraries/Assimalign.Viu.Tooling.UtilityCss/Assimalign.Viu.Tooling.UtilityCss.slnx
          --configuration Release
          -warnaserror

      - name: Build SDK utility host (warnings are errors)
        run: >-
          dotnet build
          sdks/Assimalign.Viu.Sdk/Tasks/Assimalign.Viu.Sdk.Tasks.csproj
          --configuration Release
          -warnaserror

      - name: Test
        run: >-
          dotnet test
          libraries/Assimalign.Viu.Tooling.UtilityCss/Assimalign.Viu.Tooling.UtilityCss.slnx
          --configuration Release
          --no-build

      - name: Pack utility artifacts
        shell: pwsh
        run: |
          $packageDirectory = '_out/utility-css-packages'
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null

          dotnet pack `
            libraries/Assimalign.Viu.Tooling.UtilityCss/src/Assimalign.Viu.Tooling.UtilityCss.csproj `
            --configuration Release `
            --no-build `
            -p:PackageOutputPath=$packageDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "Packing the standalone utility engine failed with exit code $LASTEXITCODE."
          }

          dotnet pack `
            sdks/Assimalign.Viu.Sdk/Tasks/Assimalign.Viu.Sdk.Tasks.csproj `
            --configuration Release `
            --no-build `
            -p:PackageOutputPath=$packageDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "Packing the SDK utility host failed with exit code $LASTEXITCODE."
          }

      - name: Verify utility artifact shapes
        shell: pwsh
        run: |
          $packageDirectory = '_out/utility-css-packages'
          $utilityPackages = @(
            Get-ChildItem $packageDirectory -Filter 'Assimalign.Viu.Tooling.UtilityCss.*.nupkg'
          )
          $sdkPackages = @(
            Get-ChildItem $packageDirectory -Filter 'Assimalign.Viu.Sdk.*.nupkg'
          )
          if ($utilityPackages.Count -ne 1) {
            throw "Expected exactly one utility engine package, found $($utilityPackages.Count)."
          }
          if ($sdkPackages.Count -ne 1) {
            throw "Expected exactly one SDK package, found $($sdkPackages.Count)."
          }

          ./scripts/Test-UtilityCssArtifactShape.ps1 `
            -UtilityCssPackage $utilityPackages[0].FullName `
            -SdkPackage $sdkPackages[0].FullName

      - name: Verify standalone dependency boundary
        shell: pwsh
        run: |
          $artifacts = @(
            Get-ChildItem _out/utility-css-packages -Filter '*.nupkg' |
              ForEach-Object FullName
          )
          ./scripts/Test-UtilityCssIndependence.ps1 -Artifact $artifacts
