# Packaged-consumer, real-browser coverage ([V01.01.11.03], #87). The matrix is
# intentionally scheduled/on-demand because three trimmed WebAssembly publications and
# three browser engines are too expensive for the pull-request critical path.
name: end-to-end browsers

on:
  workflow_dispatch:
    inputs:
      browser_engine:
        description: Browser engine to exercise
        required: true
        default: All
        type: choice
        options:
          - All
          - Chromium
          - Firefox
          - WebKit
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packaged-browser:
    name: packaged browser (${{ github.event_name == 'workflow_dispatch' && inputs.browser_engine || 'All' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up .NET and wasm-tools
        uses: ./.github/actions/setup-dotnet-wasm
        with:
          install-wasm-tools: 'true'

      - name: Run packaged browser scenarios
        shell: pwsh
        run: |
          ./scripts/Test-EndToEnd.ps1 `
            -BrowserEngine '${{ github.event_name == 'workflow_dispatch' && inputs.browser_engine || 'All' }}' `
            -Configuration Release

      - name: Upload traces, screenshots, and result summaries
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: end-to-end-browser-results
          path: _out/test-results/end-to-end/**
          if-no-files-found: warn

  packaged-hot-reload:
    name: packaged .vue publish and hot reload (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up .NET and wasm-tools
        uses: ./.github/actions/setup-dotnet-wasm
        with:
          install-wasm-tools: 'true'

      - name: Verify packaged base-SDK .vue boundary
        shell: pwsh
        run: ./scripts/Test-PackagedVueConsumer.ps1

      - name: Verify packaged Browser .vue Release assets
        shell: pwsh
        run: |
          ./scripts/Test-EndToEnd.ps1 `
            -PackagedVuePublish `
            -PublishOnly `
            -PublishDirectory ./_out/test-results/packaged-vue-release `
            -Configuration Release `
            -SkipPack

      - name: Verify packaged Browser .vue AOT assets
        shell: pwsh
        run: |
          ./scripts/Test-EndToEnd.ps1 `
            -PackagedVuePublish `
            -PublishOnly `
            -PublishDirectory ./_out/test-results/packaged-vue-aot `
            -Configuration Release `
            -Aot `
            -SkipPack

      - name: Run isolated packaged hot-reload scenario
        shell: pwsh
        run: |
          ./scripts/Test-EndToEnd.ps1 `
            -HotReload `
            -BrowserEngine Chromium `
            -Configuration Debug `
            -SkipPack `
            -ArtifactsDirectory ./_out/test-results/end-to-end-hot-reload

      - name: Upload watch log, trace, screenshot, and result summary
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: end-to-end-hot-reload-results
          path: _out/test-results/end-to-end-hot-reload/**
          if-no-files-found: warn
