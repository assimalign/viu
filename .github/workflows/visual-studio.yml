# Windows-only build and test for the in-process Visual Studio clients and their editor-neutral,
# out-of-process language servers. Publishing belongs to release.yml.
#
# This root deliberately does NOT use .github/actions/build ([V01.01.12.02.02]): the extension is a
# classic in-process VSSDK package whose build tasks are .NET Framework MSBuild tasks and cannot load
# under `dotnet build`, so Build.ps1 drives Visual Studio's own MSBuild through vswhere. It stays a
# hand-written lane for that reason, and its test projects are named individually below.
name: Visual Studio

on:
  push:
    branches: [main]
    paths:
      - 'extensions/VisualStudio/**'
      # The language service, the language server, and the shared .viu -> C# projection core
      # [V01.01.06.11] ship inside the language-server payload, so changes to those tooling
      # areas must re-verify the extension build and the packaged VSIX.
      - 'tooling/**'
      - 'libraries/Syntax/**'
      - 'libraries/ServerRenderer/**'
      - 'libraries/Utilities/**'
      - 'build/**'
      - 'scripts/Test-NoNodeToolchain.ps1'
      # The packed-consumer round trip consumes the Install-Local feed (SDK + framework packs), so
      # its lane inputs re-verify this workflow ([V01.01.12.23]).
      - 'scripts/Install-Local.ps1'
      - 'scripts/Test-LanguageServerSemanticRoundTrip.ps1'
      - 'sdks/**'
      - 'frameworks/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.github/actions/**'
      - '.github/workflows/visual-studio.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extensions/VisualStudio/**'
      - 'tooling/**'
      - 'libraries/Syntax/**'
      - 'libraries/ServerRenderer/**'
      - 'libraries/Utilities/**'
      - 'build/**'
      - 'scripts/Test-NoNodeToolchain.ps1'
      - 'scripts/Install-Local.ps1'
      - 'scripts/Test-LanguageServerSemanticRoundTrip.ps1'
      - 'sdks/**'
      - 'frameworks/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'nuget.config'
      - '.github/actions/**'
      - '.github/workflows/visual-studio.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: visual-studio (extensions)
    runs-on: windows-latest
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet-wasm

      - name: Build extensions
        shell: pwsh
        run: ./extensions/VisualStudio/Build.ps1 -Configuration Release

      # The packed-consumer semantic round trip ([V01.01.12.23], #259, acceptance criterion 5):
      # pack the SDK + framework feed, then drive the published single-file server over stdio
      # against a restored consumer scaffold. Runs here because this is the only lane that builds
      # the server payload; the packaging lane never does. Cost: roughly six to eight minutes.
      - name: Install local Viu packages
        shell: pwsh
        run: ./scripts/Install-Local.ps1

      - name: Verify packed-consumer semantic round trip
        shell: pwsh
        run: ./scripts/Test-LanguageServerSemanticRoundTrip.ps1 -Configuration Release

      # The test projects are named individually rather than handing over
      # Assimalign.Viu.VisualStudio.slnx: that solution also carries the extension itself, which is a
      # classic in-process VSSDK package whose build tasks are .NET Framework MSBuild tasks and
      # cannot load under `dotnet`. The extension is built and packaged by Build.ps1 above, through
      # Visual Studio's MSBuild. The language service and language server are also built and tested
      # on Linux by tooling.yml; this run re-verifies them against the Windows payload.
      - name: Test language service
        run: dotnet test tooling/Editor/Assimalign.Viu.LanguageService/test/Assimalign.Viu.LanguageService.Tests.csproj --configuration Release

      - name: Test language server
        run: dotnet test tooling/Editor/Assimalign.Viu.LanguageServer/test/Assimalign.Viu.LanguageServer.Tests.csproj --configuration Release

      - name: Test Utility CSS language server
        run: dotnet test libraries/Utilities/Assimalign.Viu.UtilityCss.LanguageServer/test/Assimalign.Viu.UtilityCss.LanguageServer.Tests.csproj --configuration Release

      - name: Test Visual Studio extension
        run: dotnet test extensions/VisualStudio/Assimalign.Viu.VisualStudio/test/Assimalign.Viu.VisualStudio.Tests.csproj --configuration Release

      - name: Test Utility CSS Visual Studio extension
        run: dotnet test extensions/VisualStudio/Assimalign.Viu.VisualStudio.UtilityCss/test/Assimalign.Viu.VisualStudio.UtilityCss.Tests.csproj --configuration Release

      - name: Inspect packaged VSIX files
        shell: pwsh
        run: |
          $extensions = @(
            [pscustomobject]@{
              Name = 'Assimalign.Viu.VisualStudio'
              Path = '_out/extensions/VisualStudio/Release/Assimalign.Viu.VisualStudio.vsix'
              Identity = 'Assimalign.Viu.VisualStudio.9d68bb9d-64dd-4715-8362-164655899684'
            },
            [pscustomobject]@{
              Name = 'Assimalign.Viu.VisualStudio.UtilityCss'
              Path = '_out/extensions/VisualStudio/Release/Assimalign.Viu.VisualStudio.UtilityCss.vsix'
              Identity = 'Assimalign.Viu.VisualStudio.UtilityCss.8fcd5c9a-f62f-467c-8655-b7791c41775b'
            }
          )

          $maximumPackageSize = 50MB
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($extension in $extensions) {
            $extensionFile = Get-Item -LiteralPath $extension.Path
            if ($extensionFile.Length -gt $maximumPackageSize) {
              throw "$($extension.Name) is $($extensionFile.Length) bytes; Marketplace packages must remain at or below $maximumPackageSize bytes."
            }

            $extensionArchive = [System.IO.Compression.ZipFile]::OpenRead(
              $extensionFile.FullName)
            try {
              $manifestEntry = $extensionArchive.GetEntry('extension.vsixmanifest')
              if ($null -eq $manifestEntry) {
                throw "$($extension.Name) does not contain extension.vsixmanifest."
              }

              $manifestReader = [System.IO.StreamReader]::new($manifestEntry.Open())
              try {
                [xml] $manifest = $manifestReader.ReadToEnd()
              }
              finally {
                $manifestReader.Dispose()
              }

              $namespaceManager = [System.Xml.XmlNamespaceManager]::new(
                $manifest.NameTable)
              $namespaceManager.AddNamespace(
                'vsix',
                'http://schemas.microsoft.com/developer/vsx-schema/2011')
              $identity = $manifest.SelectSingleNode(
                '/vsix:PackageManifest/vsix:Metadata/vsix:Identity',
                $namespaceManager)
              $preview = $manifest.SelectSingleNode(
                '/vsix:PackageManifest/vsix:Metadata/vsix:Preview',
                $namespaceManager)
              if ($null -eq $identity) {
                throw "$($extension.Name) manifest does not contain an Identity element."
              }
              if ($identity.Id -ne $extension.Identity) {
                throw "Unexpected $($extension.Name) VSIX identity: $($identity.Id)."
              }
              if ($identity.Publisher -ne 'Assimalign') {
                throw "Unexpected $($extension.Name) VSIX publisher: $($identity.Publisher)."
              }
              if ($null -eq $preview -or $preview.InnerText -ne 'true') {
                throw "$($extension.Name) must remain a Marketplace preview."
              }
            }
            finally {
              $extensionArchive.Dispose()
            }

            $extensionHash = Get-FileHash -LiteralPath $extension.Path -Algorithm SHA256
            $packageSizeInMegabytes = $extensionFile.Length / 1MB
            Write-Host ("Validated {0} {1}, {2:N2} MB ({3} bytes), SHA256 {4}." -f `
              $extension.Name,
              $identity.Version,
              $packageSizeInMegabytes,
              $extensionFile.Length,
              $extensionHash.Hash)
          }

      - name: Verify no Node toolchain boundary
        shell: pwsh
        run: |
          ./scripts/Test-NoNodeToolchain.ps1 -Artifact @(
            '_out/extensions/VisualStudio/Release/Assimalign.Viu.VisualStudio.vsix',
            '_out/extensions/VisualStudio/Release/Assimalign.Viu.VisualStudio.UtilityCss.vsix'
          )

      - name: Upload VSIX build artifact
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Assimalign.Viu.VisualStudio
          path: _out/extensions/VisualStudio/Release/Assimalign.Viu.VisualStudio.vsix
          if-no-files-found: error
          retention-days: 7

      - name: Upload Utility CSS VSIX build artifact
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Assimalign.Viu.VisualStudio.UtilityCss
          path: _out/extensions/VisualStudio/Release/Assimalign.Viu.VisualStudio.UtilityCss.vsix
          if-no-files-found: error
          retention-days: 7
