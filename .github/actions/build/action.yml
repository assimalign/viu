# The one build recipe every generic Viu pipeline runs ([V01.01.12.02.02]): restore, build with
# warnings as errors, and test. The workflows under .github/workflows stay thin (a path filter, a
# matrix of explicit project-folder paths, and a call to this action), so the build logic exists once
# instead of once per area, and adding a project is one matrix-row edit.
#
# The repository checkout stays in the calling workflow: a local composite action cannot run before
# the repository that contains it is checked out.
name: Viu Build
description: >-
  Restores, builds (warnings as errors), and tests one Viu project folder.

inputs:
  project-path:
    description: >-
      Repository-relative path to the project folder that owns src/ and test/. The explicit path
      supports both direct code-root children and projects nested beneath an area folder.
    required: true
  repository-path:
    description: >-
      Workspace-relative path to the Viu checkout. Defaults to the workspace root;
      paired consumer builds set this to viu.
    required: false
    default: '.'
  install-wasm-tools:
    description: >-
      Install the wasm-tools workload. Needed by any job that builds for the browser-wasm
      runtime identifier: WebAssembly app builds and the Assimalign.Viu.App runtime pack. No
      Viu library targets browser-wasm directly, so library and tooling lanes leave this off.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The single point of CI environment setup stays in setup-dotnet-wasm so the SDK pin, the NuGet
    # cache key, and the wasm-tools workload cannot drift between this action and the workflows that
    # still call it directly (release.yml and visual-studio.yml).
    - name: Set up .NET
      uses: ./.github/actions/setup-dotnet-wasm
      with:
        repository-path: ${{ inputs.repository-path }}
        install-wasm-tools: ${{ inputs.install-wasm-tools }}

    - name: Resolve ${{ inputs.project-path }}
      shell: pwsh
      env:
        VIU_REPOSITORY_PATH: ${{ inputs.repository-path }}
        VIU_PROJECT_PATH: ${{ inputs.project-path }}
      run: |
        $projectDirectory = Join-Path $env:VIU_REPOSITORY_PATH $env:VIU_PROJECT_PATH
        if (-not (Test-Path -LiteralPath $projectDirectory -PathType Container)) {
          throw "No project folder at $projectDirectory. A stale matrix path fails loudly here instead of surfacing later as MSB1009."
        }

        # The shipping project is DISCOVERED, never composed from the matrix entry. Folder name and
        # assembly id diverge in analyzers/ (Assimalign.Viu.Generators.Reactive holds
        # Assimalign.Viu.Generators.Reactivity), and a composed path would resolve to a file that
        # does not exist. The inverted layout guarantees exactly one shipping project per folder.
        $sourceProject = @(
          Get-ChildItem `
            -LiteralPath (Join-Path $projectDirectory 'src') `
            -Filter '*.csproj' `
            -File `
            -ErrorAction SilentlyContinue
        )
        if ($sourceProject.Count -ne 1) {
          throw "Expected exactly one shipping project under $projectDirectory/src, found $($sourceProject.Count)."
        }

        # Every project under test/ is discovered, including the ones that live in their own
        # subfolder (the compiled-render and compiled-component suites, the netstandard2.0 generator
        # fixture). The per-area solution files never listed some of them, so they were built by
        # nobody in CI.
        $testDirectory = Join-Path $projectDirectory 'test'
        $testProject = @(
          if (Test-Path -LiteralPath $testDirectory -PathType Container) {
            Get-ChildItem -LiteralPath $testDirectory -Filter '*.csproj' -File -Recurse
          }
        )

        # A project under test/ is not necessarily a test HOST: the generator fixture exists to prove
        # a linked shared source compiles under netstandard2.0 and carries no test SDK, so it is
        # built but never handed to `dotnet test`.
        $runnableTestProject = @(
          $testProject |
            Where-Object {
              (Get-Content -LiteralPath $_.FullName -Raw) -match 'Microsoft\.NET\.Test\.Sdk'
            }
        )

        @(
          "VIU_SOURCE_PROJECT=$($sourceProject[0].FullName)"
          "VIU_TEST_PROJECTS=$(($testProject | ForEach-Object FullName) -join ';')"
          "VIU_RUNNABLE_TEST_PROJECTS=$(($runnableTestProject | ForEach-Object FullName) -join ';')"
        ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        Write-Host "Shipping project: $($sourceProject[0].FullName)"
        Write-Host "Test projects: $($testProject.Count) ($($runnableTestProject.Count) runnable)"

    - name: Build ${{ inputs.project-path }} (warnings are errors)
      shell: pwsh
      run: |
        $projects = @($env:VIU_SOURCE_PROJECT) +
          @($env:VIU_TEST_PROJECTS -split ';' | Where-Object { $_ })
        foreach ($project in $projects) {
          & dotnet build $project --configuration Release -warnaserror
          if ($LASTEXITCODE -ne 0) {
            throw "Building $project failed with exit code $LASTEXITCODE."
          }
        }

    - name: Test ${{ inputs.project-path }}
      shell: pwsh
      run: |
        $projects = @($env:VIU_RUNNABLE_TEST_PROJECTS -split ';' | Where-Object { $_ })
        if ($projects.Count -eq 0) {
          Write-Host 'No test host in this project folder.'
          return
        }

        foreach ($project in $projects) {
          & dotnet test $project --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) {
            throw "Testing $project failed with exit code $LASTEXITCODE."
          }
        }
