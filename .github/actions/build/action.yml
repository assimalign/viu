# The one build recipe every generic Viu pipeline runs ([V01.01.12.02.02]): restore, build with
# warnings as errors, test, and — on a main push, from Linux, for a packable project — pack and
# publish to GitHub Packages. The workflows under .github/workflows stay thin (a path filter, a
# matrix of project folder names, and a call to this action), so the build logic exists once
# instead of once per area, and adding a project is a one-line matrix edit.
#
# The repository checkout stays in the calling workflow: a local composite action cannot run before
# the repository that contains it is checked out.
name: Viu Build
description: >-
  Restores, builds (warnings as errors), and tests one Viu project from a code root, and on a push
  to main from Linux packs it and publishes it to GitHub Packages when the project is packable.

inputs:
  area:
    description: >-
      The repository code root that holds the project set, such as 'libraries', 'tooling', or
      'analyzers'. Each root uses the inverted <root>/<folder>/{src,test} layout.
    required: true
  project:
    description: >-
      The project folder under the code root. It is usually also the assembly id, but never assumed
      to be: the shipping project and its tests are discovered inside the folder.
    required: true
  repository-path:
    description: >-
      Workspace-relative path to the Viu checkout. Defaults to the workspace root;
      paired consumer builds set this to viu.
    required: false
    default: '.'
  install-wasm-tools:
    description: >-
      Install the wasm-tools workload. Needed by any job that builds for the browser-wasm
      runtime identifier: WebAssembly app builds and the Assimalign.Viu.App runtime pack. No
      Viu library targets browser-wasm directly, so library and tooling lanes leave this off.
    required: false
    default: 'false'
  publish-packages:
    description: >-
      Whether this code root publishes NuGet packages. Even when true, the pack and push only run
      for a push to main, from a Linux runner, and for a project that is actually packable
      (a project declaring IsPackable=false is skipped, matching the inventory guard in
      scripts/modules/ViuPackaging.psm1).
    required: false
    default: 'false'
  package-feed:
    description: The NuGet feed a publishable package is pushed to.
    required: false
    default: 'https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json'
  github-token:
    description: >-
      Token used to push to the package feed. A composite action cannot read secrets, so the calling
      workflow passes secrets.GITHUB_TOKEN and grants the job packages:write.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The single point of CI environment setup stays in setup-dotnet-wasm so the SDK pin, the NuGet
    # cache key, and the wasm-tools workload cannot drift between this action and the workflows that
    # still call it directly (release.yml, visual-studio.yml, and budget-gates.yml).
    - name: Set up .NET
      uses: ./.github/actions/setup-dotnet-wasm
      with:
        repository-path: ${{ inputs.repository-path }}
        install-wasm-tools: ${{ inputs.install-wasm-tools }}

    - name: Resolve ${{ inputs.project }}
      shell: pwsh
      env:
        VIU_REPOSITORY_PATH: ${{ inputs.repository-path }}
        VIU_AREA: ${{ inputs.area }}
        VIU_PROJECT: ${{ inputs.project }}
      run: |
        $projectDirectory = Join-Path $env:VIU_REPOSITORY_PATH (Join-Path $env:VIU_AREA $env:VIU_PROJECT)
        if (-not (Test-Path -LiteralPath $projectDirectory -PathType Container)) {
          throw "No project folder at $projectDirectory. A matrix entry that no longer exists is the failure mode the per-area workflows died of (MSB1009 on a renamed folder), so it fails loudly here."
        }

        # The shipping project is DISCOVERED, never composed from the matrix entry. Folder name and
        # assembly id diverge in analyzers/ (Assimalign.Viu.Generators.Reactive holds
        # Assimalign.Viu.Generators.Reactivity), and a composed path would resolve to a file that
        # does not exist. The inverted layout guarantees exactly one shipping project per folder.
        $sourceProject = @(
          Get-ChildItem `
            -LiteralPath (Join-Path $projectDirectory 'src') `
            -Filter '*.csproj' `
            -File `
            -ErrorAction SilentlyContinue
        )
        if ($sourceProject.Count -ne 1) {
          throw "Expected exactly one shipping project under $projectDirectory/src, found $($sourceProject.Count)."
        }

        # Every project under test/ is discovered, including the ones that live in their own
        # subfolder (the compiled-render and compiled-component suites, the netstandard2.0 generator
        # fixture). The per-area solution files never listed some of them, so they were built by
        # nobody in CI.
        $testDirectory = Join-Path $projectDirectory 'test'
        $testProject = @(
          if (Test-Path -LiteralPath $testDirectory -PathType Container) {
            Get-ChildItem -LiteralPath $testDirectory -Filter '*.csproj' -File -Recurse
          }
        )

        # A project under test/ is not necessarily a test HOST: the generator fixture exists to prove
        # a linked shared source compiles under netstandard2.0 and carries no test SDK, so it is
        # built but never handed to `dotnet test`.
        $runnableTestProject = @(
          $testProject |
            Where-Object {
              (Get-Content -LiteralPath $_.FullName -Raw) -match 'Microsoft\.NET\.Test\.Sdk'
            }
        )

        # Same predicate the packaging inventory guard uses (Test-ViuProjectPackable in
        # scripts/modules/ViuPackaging.psm1): packable unless the project literally opts out.
        $projectXml = [xml](Get-Content -LiteralPath $sourceProject[0].FullName -Raw)
        $isPackable = $projectXml.SelectSingleNode('/Project/PropertyGroup/IsPackable')
        $packable = -not ($isPackable -and $isPackable.InnerText.Trim() -eq 'false')

        @(
          "VIU_SOURCE_PROJECT=$($sourceProject[0].FullName)"
          "VIU_TEST_PROJECTS=$(($testProject | ForEach-Object FullName) -join ';')"
          "VIU_RUNNABLE_TEST_PROJECTS=$(($runnableTestProject | ForEach-Object FullName) -join ';')"
          "VIU_IS_PACKABLE=$($packable.ToString().ToLowerInvariant())"
        ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        Write-Host "Shipping project: $($sourceProject[0].FullName)"
        Write-Host "Test projects: $($testProject.Count) ($($runnableTestProject.Count) runnable)"
        Write-Host "Packable: $packable"

    - name: Build ${{ inputs.project }} (warnings are errors)
      shell: pwsh
      run: |
        $projects = @($env:VIU_SOURCE_PROJECT) +
          @($env:VIU_TEST_PROJECTS -split ';' | Where-Object { $_ })
        foreach ($project in $projects) {
          & dotnet build $project --configuration Release -warnaserror
          if ($LASTEXITCODE -ne 0) {
            throw "Building $project failed with exit code $LASTEXITCODE."
          }
        }

    - name: Test ${{ inputs.project }}
      shell: pwsh
      run: |
        $projects = @($env:VIU_RUNNABLE_TEST_PROJECTS -split ';' | Where-Object { $_ })
        if ($projects.Count -eq 0) {
          Write-Host 'No test host in this project folder.'
          return
        }

        foreach ($project in $projects) {
          & dotnet test $project --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) {
            throw "Testing $project failed with exit code $LASTEXITCODE."
          }
        }

    # Publishing is deliberately narrow. release.yml remains the authoritative publisher: it packs
    # the complete, checksummed, uniquely versioned beta set (<canonical>-beta.<run>) on a merged
    # pull request and pushes all of it under one concurrency group. This step maintains the
    # canonical-version stream instead, so a freshly bumped $(ViuVersion) reaches the feed as soon as
    # it lands on main. --skip-duplicate makes a same-version re-push a no-op rather than an error,
    # which is what keeps repeated main pushes idempotent.
    - name: Pack and publish ${{ inputs.project }}
      if: >-
        inputs.publish-packages == 'true' &&
        runner.os == 'Linux' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      shell: pwsh
      env:
        VIU_REPOSITORY_PATH: ${{ inputs.repository-path }}
        VIU_PACKAGE_FEED: ${{ inputs.package-feed }}
        VIU_PACKAGE_TOKEN: ${{ inputs.github-token }}
      run: |
        if ($env:VIU_IS_PACKABLE -ne 'true') {
          Write-Host "$env:VIU_SOURCE_PROJECT declares IsPackable=false; nothing to publish."
          return
        }
        if ([string]::IsNullOrWhiteSpace($env:VIU_PACKAGE_TOKEN)) {
          throw 'publish-packages is true but no github-token was supplied. Pass secrets.GITHUB_TOKEN and grant the job packages:write.'
        }

        # An ABSOLUTE output path. A relative -p:PackageOutputPath resolves against the PROJECT
        # directory, not the working directory, which is how the retired area-utility-css workflow
        # packed into tooling/.../src/_out and then failed asserting on an empty _out at the root.
        $packageDirectory = Join-Path `
          (Resolve-Path -LiteralPath $env:VIU_REPOSITORY_PATH).Path `
          '_out/packages'
        New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null

        & dotnet pack $env:VIU_SOURCE_PROJECT `
          --configuration Release `
          --no-build `
          "-p:PackageOutputPath=$packageDirectory"
        if ($LASTEXITCODE -ne 0) {
          throw "Packing $env:VIU_SOURCE_PROJECT failed with exit code $LASTEXITCODE."
        }

        $packages = @(
          Get-ChildItem -LiteralPath $packageDirectory -Filter '*.nupkg' -File
        )
        if ($packages.Count -eq 0) {
          throw "Packing $env:VIU_SOURCE_PROJECT produced no package in $packageDirectory."
        }

        foreach ($package in $packages) {
          & dotnet nuget push $package.FullName `
            --source $env:VIU_PACKAGE_FEED `
            --api-key $env:VIU_PACKAGE_TOKEN `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing $($package.Name) failed with exit code $LASTEXITCODE."
          }
        }
